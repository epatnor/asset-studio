<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinkertown – generatorerna</title>
<style>
  :root { --ink: #1f2a1c; --panel: rgba(255, 255, 255, 0.82); --accent: #4e8a2f; }
  html, body { margin: 0; height: 100%; background: #9cc4ec; font-family: system-ui, sans-serif; color: var(--ink); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .panel { position: fixed; top: 16px; left: 16px; max-width: min(360px, calc(100vw - 32px)); background: var(--panel);
           backdrop-filter: blur(6px); border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15); }
  .panel h1 { margin: 0 0 4px; font-size: 18px; }
  .panel p { margin: 0 0 10px; font-size: 13px; opacity: 0.8; }
  .panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .panel select, .panel input[type=range] { flex: 1; }
  #status { font-size: 12px; opacity: 0.7; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.85); color: var(--ink);
         white-space: nowrap; pointer-events: none; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
  .row-title { font-size: 15px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--accent); color: #fff;
               white-space: nowrap; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>Tinkertown · generatorerna</h1>
  <p>Allt nedan är genererat från recept. Dra för att rotera, scrolla för att zooma. <a href="park.html">Till parken</a> · <a href="skogen.html">Skogen</a></p>
  <label>Detaljnivå <select id="lod"><option value="0">LOD0 (nära)</option><option value="1">LOD1</option><option value="2">LOD2 (långt bort)</option></select></label>
  <label>Vind <input id="wind" type="range" min="0" max="2" step="0.05" value="0.6"></label>
  <label><input id="labels" type="checkbox" checked> Visa skyltar</label>
  <div id="status">Laddar…</div>
  <p id="hint" style="margin:8px 0 0">Klicka på scenen för att gå runt i förstaperson: <b>WASD</b> gå, <b>Shift</b> spring, <b>Space</b> hopp, <b>mus</b> titta. <b>Esc</b> släpper musen, <b>Tab</b> växlar till översikt.</p>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { shareTextures } from './shared_textures.js';
import { createMaterialPatcher } from './materials.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping; // stilguiden: AgX
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color('#8fbdf0'), HORIZON = new THREE.Color('#d9ecff');
scene.fog = new THREE.Fog(HORIZON, 60, 220);

// Himmel: gradient från horisont till zenit på en stor sfär
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: SKY }, bottom: { value: HORIZON } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y * 1.6, 0., 1.); gl_FragColor = vec4(mix(bottom, top, h), 1.); }',
}));
scene.add(sky);

// Ljus enligt stilguiden: varm sol ~45°, kall himmel som fyllning
scene.add(new THREE.HemisphereLight('#cfe6ff', '#5d7a3a', 1.1));
const sun = new THREE.DirectionalLight('#ffe9c7', 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.CircleGeometry(300, 64), new THREE.MeshStandardMaterial({ color: '#6fa046', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

// Vind, platta stjälkar, lövens genomlysning och stenarnas mossa: samma materialtillägg som i parken
const windUniforms = { uTime: { value: 0 }, uWind: { value: 0.6 } };
const sunDir = { value: new THREE.Vector3(0.6, 1.1, 0.8).normalize() }; // samma riktning som solen nedan
const patchMaterial = createMaterialPatcher(THREE, { wind: windUniforms, sunDir });

// --- Förstapersonsläge: kamera i ögonhöjd med mouselook ---
const colliders = [];
const EYE = 1.65;
const fp = { active: false, pos: new THREE.Vector3(), yaw: 0, pitch: -0.05, vel: 0, onGround: true, keys: new Set() };
window.__tinker = { fp, setMode: (a) => setMode(a) }; // för felsökning och automatiska tester

function setMode(active) {
  fp.active = active;
  controls.enabled = !active;
  if (!active && document.pointerLockElement) document.exitPointerLock();
}
renderer.domElement.addEventListener('click', () => {
  if (!fp.active) setMode(true);
  renderer.domElement.requestPointerLock();
});
addEventListener('mousemove', (e) => {
  if (!fp.active || document.pointerLockElement !== renderer.domElement) return;
  fp.yaw -= e.movementX * 0.0022;
  // Full frihet uppåt och nedåt (±90°, strax innan polen så att rotationen inte vänder)
  fp.pitch = THREE.MathUtils.clamp(fp.pitch - e.movementY * 0.0022, -Math.PI / 2 + 0.001, Math.PI / 2 - 0.001);
});
addEventListener('keydown', (e) => {
  if (e.code === 'Tab') { e.preventDefault(); setMode(!fp.active); return; }
  fp.keys.add(e.code);
  if (e.code === 'Space' && fp.active && fp.onGround) { fp.vel = 5; fp.onGround = false; }
});
addEventListener('keyup', (e) => fp.keys.delete(e.code));

function updateFp(dt) {
  const k = fp.keys;
  const fwd = new THREE.Vector3(-Math.sin(fp.yaw), 0, -Math.cos(fp.yaw));
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const move = new THREE.Vector3();
  if (k.has('KeyW')) move.add(fwd);
  if (k.has('KeyS')) move.sub(fwd);
  if (k.has('KeyD')) move.add(right);
  if (k.has('KeyA')) move.sub(right);
  const speed = k.has('ShiftLeft') || k.has('ShiftRight') ? 7.5 : 3.2;
  if (move.lengthSq() > 0) fp.pos.add(move.normalize().multiplyScalar(speed * dt));
  fp.vel -= 14 * dt;
  fp.pos.y += fp.vel * dt;
  if (fp.pos.y <= 0) { fp.pos.y = 0; fp.vel = 0; fp.onGround = true; }
  // Kollision mot stammar och buskar (spelarens radie 0,35 m)
  for (const c of colliders) {
    const dx = fp.pos.x - c.x, dz = fp.pos.z - c.z, min = c.r + 0.35, d2 = dx * dx + dz * dz;
    if (d2 < min * min && d2 > 1e-8) { const d = Math.sqrt(d2); fp.pos.x = c.x + (dx / d) * min; fp.pos.z = c.z + (dz / d) * min; }
  }
  camera.position.set(fp.pos.x, fp.pos.y + EYE, fp.pos.z);
  camera.rotation.set(fp.pitch, fp.yaw, 0, 'YXZ');
}

// --- Skyltar: små träskyltar nedstuckna i marken, med text målad på en canvas ---
const signs = [];
const postMat = new THREE.MeshStandardMaterial({ color: '#7a5636', roughness: 0.9 });
function makeSign(text, tint, scale = 1) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const font = 'bold 44px system-ui, sans-serif';
  ctx.font = font;
  const tw = ctx.measureText(text).width + (tint ? 46 : 0);
  c.width = Math.ceil(tw + 48); c.height = 84;
  // Trä: grundfärg, några ådror och en mörkare kant
  ctx.fillStyle = '#c59a62'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'rgba(110, 72, 38, 0.35)'; ctx.lineWidth = 2;
  for (let y = 12; y < c.height; y += 14) { ctx.beginPath(); ctx.moveTo(0, y + Math.sin(y) * 2); ctx.bezierCurveTo(c.width * 0.3, y - 3, c.width * 0.7, y + 4, c.width, y); ctx.stroke(); }
  ctx.strokeStyle = '#7a5636'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, c.width - 6, c.height - 6);
  ctx.font = font; ctx.fillStyle = '#3b2615'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 24, c.height / 2 + 2);
  if (tint) { ctx.fillStyle = tint; ctx.beginPath(); ctx.arc(c.width - 34, c.height / 2, 14, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#3b2615'; ctx.lineWidth = 3; ctx.stroke(); }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const h = 0.24 * scale, w = h * (c.width / c.height);
  const sign = new THREE.Group();
  const front = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
  const wood = new THREE.MeshStandardMaterial({ color: '#a77d4c', roughness: 0.9 });
  // Box-sidor: +x, -x, +y, -y, +z (fram, texten), -z (bak)
  const board = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.035 * scale), [wood, wood, wood, wood, front, wood]);
  board.position.y = 0.5 * scale;
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.05 * scale, 0.62 * scale, 0.05 * scale), postMat);
  post.position.set(0, 0.25 * scale, -0.03 * scale);
  for (const m of [board, post]) { m.castShadow = true; m.receiveShadow = true; sign.add(m); }
  // Lite snett, som om den stuckits ner för hand
  sign.rotation.set((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.1);
  signs.push(sign);
  return sign;
}

const loader = shareTextures(new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)) // geometrin är meshopt-komprimerad;
const placed = [];
const status = document.getElementById('status');

function setLod(n) {
  for (const { root } of placed) root.traverse((o) => {
    const m = o.name.match(/_LOD(\d)$/);
    if (m) o.visible = Number(m[1]) === n;
  });
}

async function main() {
  const catalog = await (await fetch('catalog.json', { cache: 'no-cache' })).json();
  // Små växter längst fram, höga träd längst bak
  const rows = [...catalog.rows].reverse();
  let z = 0, total = 0, loaded = 0;
  rows.forEach((r) => (total += r.items.length));
  const bounds = new THREE.Box3();
  for (const row of rows) {
    const models = await Promise.all(row.items.map(async (it) => {
      const gltf = await loader.loadAsync(it.model);
      status.textContent = `Laddar ${++loaded} / ${total}`;
      return { it, root: gltf.scene };
    }));
    // Mät LOD0 för varje modell och ställ dem på rad med luft emellan
    let x = 0, depth = 0;
    const row3d = new THREE.Group();
    for (const m of models) {
      m.root.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = o.receiveShadow = true;
          patchMaterial(o.material, m.it.model);
        }
        const lod = o.name.match(/_LOD(\d)$/);
        if (lod) o.visible = lod[1] === '0';
      });
      const box = new THREE.Box3().setFromObject(m.root, true);
      const size = box.getSize(new THREE.Vector3());
      const w = Math.max(size.x, 0.8);
      m.root.position.set(x + w / 2 - (box.min.x + box.max.x) / 2, 0, -(box.min.z + box.max.z) / 2);
      row3d.add(m.root);
      const sign = makeSign(m.it.label, m.it.tint);
      sign.position.set(m.root.position.x, 0, size.z / 2 + 0.7);
      row3d.add(sign);
      x += w + Math.max(1.8, w * 0.25); // små växter får mer luft så att etiketterna inte krockar
      depth = Math.max(depth, size.z);
      // Kollision: stammen för träd (ungefär), större delen av formen för stamlösa buskar
      let hasTrunk = false;
      m.root.traverse((o) => { if (o.isMesh && /_trunk_LOD0$/.test(o.name)) hasTrunk = true; });
      m.radius = hasTrunk ? THREE.MathUtils.clamp(size.y * 0.035, 0.25, 0.7) : Math.min(size.x, size.z) * 0.42;
      placed.push(m);
    }
    row3d.position.set(-x / 2, 0, z - depth / 2);
    scene.add(row3d);
    row3d.updateMatrixWorld(true);
    for (const m of models) { const p = new THREE.Vector3(); m.root.getWorldPosition(p); colliders.push({ x: p.x, z: p.z, r: m.radius }); }
    const title = makeSign(row.title, null, 2.2);
    title.position.set(-4, 0, 0.5);
    row3d.add(title);
    bounds.expandByObject(row3d);
    z -= depth + 6;
  }

  // Kamera och skuggkamera anpassade till hela utställningen
  const c = bounds.getCenter(new THREE.Vector3()), s = bounds.getSize(new THREE.Vector3());
  controls.target.set(c.x, s.y * 0.25, c.z);
  camera.position.set(c.x + s.x * 0.15, Math.max(s.x, s.z) * 0.45, bounds.max.z + Math.max(s.x, s.z) * 0.55);
  const r = Math.max(s.x, s.z) * 0.6;
  sun.position.set(c.x + r * 0.6, r * 1.1, c.z + r * 0.8);
  sun.target.position.copy(c);
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 1, far: r * 4 });
  sun.shadow.camera.updateProjectionMatrix();
  status.textContent = `${placed.length} föremål i ${rows.length} rader`;
  fp.pos.set(c.x, 0, bounds.max.z + 6); // startar framför utställningen och tittar in mot raderna
}

document.getElementById('lod').onchange = (e) => setLod(Number(e.target.value));
document.getElementById('wind').oninput = (e) => (windUniforms.uWind.value = Number(e.target.value));
document.getElementById('labels').onchange = (e) => signs.forEach((s) => (s.visible = e.target.checked));
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  windUniforms.uTime.value = clock.elapsedTime;
  if (fp.active) updateFp(dt); else controls.update();
  renderer.render(scene, camera);
});
main().catch((e) => { status.textContent = 'Fel: ' + e.message; console.error(e); });
</script>
</body>
</html>
