<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinkertown – vattnet</title>
<style>
  :root { --ink: #1f2a1c; --panel: rgba(255, 255, 255, 0.82); }
  html, body { margin: 0; height: 100%; background: #9cc4ec; font-family: system-ui, sans-serif; color: var(--ink); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .panel { position: fixed; top: 16px; left: 16px; max-width: min(340px, calc(100vw - 32px)); background: var(--panel);
           backdrop-filter: blur(6px); border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15); }
  .panel h1 { margin: 0 0 4px; font-size: 18px; }
  .panel p { margin: 0 0 8px; font-size: 13px; opacity: 0.85; }
  .panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .panel select, .panel input[type=range] { flex: 1; }
  .panel a { color: #2f6b2a; }
  .panel button { font: inherit; font-size: 12px; margin: 2px 2px 0 0; padding: 3px 8px; border-radius: 6px; border: 1px solid #9bb39a; background: #f4f8f1; cursor: pointer; }
  #status, #perf { font-size: 12px; opacity: 0.7; }
  #perf { font-family: ui-monospace, monospace; margin-top: 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>Tinkertown · vattnet</h1>
  <p>Vattengeneratorns typer på en kust: hav, flod, å, bäck, sjö och damm. Allt är recept. <a href="park.html">Till parken</a> · <a href="index.html">Till raderna</a></p>
  <p>Klicka för att gå runt: <b>WASD</b>, <b>Shift</b> spring, <b>mus</b> titta. <b>Tab</b> växlar till översikt.</p>
  <div id="goto"></div>
  <label>Vind <input id="wind" type="range" min="0" max="2" step="0.05" value="0.6"></label>
  <div id="status">Laddar…</div>
  <div id="perf"></div>
</div>
<script type="module">
import { createWorld } from './world.js';
import { carveWater, createWaterMeshes } from './water.js';
import { createGround } from './ground.js';
import { createGrassField, instancePlants } from './grass.js';
const W = createWorld(document.getElementById('app'), { fog: [120, 360] });
const { THREE, camera, controls, fp } = W;
window.__tinker = W;
const status = document.getElementById('status');
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
let seed = 777;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

// --- Kustterräng: kullar i norr som sluttar ner mot havet i söder ---
const SIZE = 220, SEG = 300;
function baseHeight(x, z) {
  const hills = 1.6 * Math.sin(x * 0.045 + 0.4) * Math.cos(z * 0.05) + 0.7 * Math.sin(x * 0.11 + z * 0.08) + 0.3 * Math.sin(x * 0.23 - z * 0.19);
  return 7 - z * 0.075 + hills - 6 * smooth(40, 85, z) + Math.max(0, Math.hypot(x, z) / (SIZE / 2) - 0.85) * 25;
}

// --- Vattnet som recept ---
const recipes = [
  { type: 'ocean', level: 0, center: [0, 80] },
  { type: 'lake', center: [-45, -55], radius: 16 },
  { type: 'river', points: [[58, -98], [45, -62], [52, -30], [35, 0], [38, 30], [22, 60], [18, 100]] },
  { type: 'brook', points: [[-30, -40], [-15, -30], [0, -18], [18, -8], [33, -2]], into: 2 },
  { type: 'stream', points: [[-92, -6], [-82, -20], [-70, -34], [-60, -46]], into: 1 },
  { type: 'pond', center: [-62, 28] },
];
const terrain = carveWater(recipes, baseHeight);
const heightAt = terrain.heightAt;
fp.heightAt = (x, z) => { const w = terrain.waterAt(x, z), h = heightAt(x, z); return w?.inside ? Math.max(h, w.level - 0.55) : h; };

// --- Mark: gräs och äng, ljus jord närmast havet ---
const noise = (x, z) => 0.5 + 0.25 * Math.sin(x * 0.09 + Math.sin(z * 0.07) * 2) + 0.25 * Math.sin(z * 0.08 - x * 0.03 + 1.7);
function splatAt(x, z) {
  const h = baseHeight(x, z), beach = 1 - smooth(0.5, 1.6, h);
  const meadow = smooth(0.48, 0.66, noise(x, z)) * (1 - beach), grass = Math.max(0, 1 - meadow - beach);
  return [grass, meadow, 0, beach];
}
const ground = await createGround(W, { size: SIZE, seg: SEG, terrain, surfaceAt: (x, z) => ({ y: heightAt(x, z), splat: splatAt(x, z) }) });
createWaterMeshes(W, terrain);
W.setShadowArea(new THREE.Vector3(0, 0, 0), 110);

// --- Gräs och vass ---
const field = createGrassField(W, {
  size: 150, cell: 0.4, heightAt, splatAt, textures: ground.textures, // gräs bara i mitten av kartan
  densityAt: (x, z, s) => (Math.hypot(x, z) > SIZE / 2 - 12 ? 0 : (s[0] + s[1]) * (1 - smooth(0.02, 0.5, terrain.wetAt(x, z)))),
  heightScaleAt: (x, z, s) => (0.24 + s[1] * 0.2) * (0.85 + 0.3 * noise(x * 2.3, z * 2.3)),
});
const catalog = await (await fetch('catalog.json', { cache: 'no-cache' })).json();
const plantItems = catalog.rows.flatMap((r) => r.items).filter((i) => ['reed', 'cattail'].includes(i.species));
const places = { reed: [], cattail: [] };
const tryPlant = (x, z, scale = 1) => {
  const w = terrain.waterAt(x, z);
  if (!w || w.wet < 0.05 || w.depth > 0.45 || w.body.b.type === 'ocean') return;
  const sp = rnd() < 0.6 ? 'reed' : 'cattail';
  places[sp].push({ x, y: heightAt(x, z), z, yaw: rnd() * 6.28, scale: scale * (0.85 + rnd() * 0.3), splat: splatAt(x, z) });
};
for (const body of terrain.bodies) {
  if (body.shoreAt) for (let c = 0; c < 12; c++) { const a0 = (c / 12) * 6.28 + rnd() * 0.4; for (let i = 0; i < 8; i++) tryPlant(...body.shoreAt(a0 + (rnd() - 0.5) * 0.4, 0.84 + rnd() * 0.32)); }
  if (body.S && body.b.type !== 'river') for (const s of body.S) if (rnd() < 0.2) { const o = s.w * (0.8 + rnd() * 0.5) * (rnd() < 0.5 ? -1 : 1); tryPlant(s.x - s.tz * o, s.z + s.tx * o, 0.85); }
}
for (const it of plantItems) instancePlants(W, await W.loadModel(it.model), places[it.species], { textures: ground.textures });

// --- Snabbval: hoppa till varje vattentyp ---
const names = { ocean: 'Hav', lake: 'Sjö', river: 'Flod', brook: 'Å', stream: 'Bäck', pond: 'Damm' };
const goto = document.getElementById('goto');
for (const body of terrain.bodies) {
  const b = document.createElement('button');
  b.textContent = names[body.b.type];
  b.onclick = () => {
    const [cx, cz] = body.b.type === 'ocean' ? [0, 62] : body.S ? [body.S[body.S.length >> 1].x, body.S[body.S.length >> 1].z] : body.b.center;
    const r = body.b.type === 'ocean' ? 30 : body.S ? body.b.width * 6 + 6 : body.b.radius * 1.6;
    W.setMode(false);
    camera.position.set(cx + r * 0.8, heightAt(cx, cz) + r * 0.6 + 2, cz + r * 0.9);
    controls.target.set(cx, heightAt(cx, cz), cz); controls.update();
  };
  goto.appendChild(b);
}
camera.position.set(70, 70, 150); controls.target.set(0, 0, 10); controls.update();
fp.pos.set(10, heightAt(10, 55), 55); fp.yaw = Math.PI;
status.textContent = `${terrain.bodies.length} vattendrag, ${Math.round(field.blades / 1000)} 000 grässtrån`;
document.getElementById('wind').oninput = (e) => (W.wind.uWind.value = Number(e.target.value));
{ // prestandamätare
  let frames = 0, t0 = performance.now();
  const el = document.getElementById('perf'), info = W.renderer.info.render;
  W.onFrame(() => {
    frames++; const now = performance.now(); if (now - t0 < 500) return;
    const f = (frames * 1000) / (now - t0);
    el.textContent = `${f.toFixed(0)} fps · ${(1000 / f).toFixed(1)} ms · ${info.calls} anrop · ${(info.triangles / 1e6).toFixed(2)} M tri`;
    frames = 0; t0 = now;
  });
}
</script>
</body>
</html>
