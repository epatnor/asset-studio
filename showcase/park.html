<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinkertown – parken</title>
<style>
  :root { --ink: #1f2a1c; --panel: rgba(255, 255, 255, 0.82); }
  html, body { margin: 0; height: 100%; background: #9cc4ec; font-family: system-ui, sans-serif; color: var(--ink); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .panel { position: fixed; top: 16px; left: 16px; max-width: min(340px, calc(100vw - 32px)); background: var(--panel);
           backdrop-filter: blur(6px); border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15); }
  .panel h1 { margin: 0 0 4px; font-size: 18px; }
  .panel p { margin: 0 0 8px; font-size: 13px; opacity: 0.85; }
  .panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .panel select, .panel input[type=range] { flex: 1; }
  .panel details { font-size: 13px; margin: 6px 0; }
  .panel summary { cursor: pointer; font-weight: 600; }
  .panel details label span { width: 118px; flex: none; }
  .panel input[type=color] { width: 36px; height: 22px; border: 0; padding: 0; background: none; }
  .panel a { color: #2f6b2a; }
  #status { font-size: 12px; opacity: 0.7; }
  #perf { font: 12px ui-monospace, monospace; opacity: 0.75; margin-top: 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>Tinkertown · parken</h1>
  <p>Generatorernas träd, buskar och props i en liten park, på blandad mark med stigar. Allt är genererat. <a href="index.html">Till raderna</a> · <a href="skogen.html">Skogen</a> · <a href="water.html">Vattnet</a></p>
  <p>Klicka för att gå runt: <b>WASD</b>, <b>Shift</b> spring, <b>Space</b> hopp, <b>mus</b> titta. <b>Esc</b> släpper musen, <b>Tab</b> växlar till översikt.</p>
  <label>Detaljnivå <select id="lod"><option value="0">LOD0 (nära)</option><option value="1">LOD1</option><option value="2">LOD2 (långt bort)</option></select></label>
  <label>Vind <input id="wind" type="range" min="0" max="2" step="0.05" value="0.6"></label>
  <label><input id="labels" type="checkbox"> Visa skyltar</label>
  <details id="grassPanel"><summary>Gräs</summary>
    <label><span>Toppfärger</span><input id="gTipA" type="color" value="#5e9e34"><input id="gTipB" type="color" value="#8db43e"></label>
    <label><span>Markfärg i toppen</span><input id="gGroundMix" type="range" min="0" max="1" step="0.02" value="0.3"></label>
    <label><span>Ljushet</span><input id="gBright" type="range" min="0.5" max="1.4" step="0.02" value="0.9"></label>
    <label><span>Höjd</span><input id="gHeight" type="range" min="0.3" max="2" step="0.05" value="1"></label>
    <label><span>Täthet</span><input id="gDensity" type="range" min="0" max="1" step="0.02" value="0.8"></label>
    <label><span>Räckvidd (m)</span><input id="gRange" type="range" min="15" max="90" step="1" value="46"></label>
    <label><span>Vindriktning</span><input id="gDir" type="range" min="0" max="360" step="1" value="37"></label>
    <label><span>Byarnas längd (m)</span><input id="gGustLen" type="range" min="4" max="40" step="0.5" value="14"></label>
    <label><span>Byarnas fart</span><input id="gGustSpeed" type="range" min="0" max="4" step="0.05" value="1.6"></label>
  </details>
  <div id="status">Laddar…</div>
  <div id="perf"></div>
</div>
<script type="module">
import { createWorld } from './world.js';
import { createGrassField, instancePlants } from './grass.js';
import { carveWater, createWaterMeshes } from './water.js';
import { createGround } from './ground.js';
const W = createWorld(document.getElementById('app'), { fog: [80, 280] });
const { THREE, scene, camera, controls, fp } = W;
window.__tinker = W; // för felsökning och automatiska tester
const status = document.getElementById('status');

// Seedad slump, så att parken ser likadan ut varje gång
let seed = 12345;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

// --- Terräng: mjuka kullar, något plattare i mitten ---
const SIZE = 120, SEG = 240;
function baseHeight(x, z) {
  const r = Math.hypot(x, z) / (SIZE / 2);
  const hills = 1.3 * Math.sin(x * 0.05 + 1.1) * Math.cos(z * 0.045 - 0.4) + 0.6 * Math.sin(x * 0.11 + z * 0.07) + 0.25 * Math.sin(x * 0.23 - z * 0.19);
  return hills * (0.35 + 0.65 * Math.min(1, r * 1.4)) + Math.max(0, r - 0.8) * 6; // höjs mot kanten, som en skål
}

// --- Stigar: slingrande splines, plana mot terrängen ---
const pathDefs = [
  [[-45, -30], [-20, -38], [5, -25], [25, -32], [44, -12], [38, 15], [15, 22], [-5, 12], [-28, 20], [-46, 5]],
  [[-5, 12], [0, -2], [5, -25]],
  [[15, 22], [20, 40], [5, 50]],
];
const pathPts = [];
for (const def of pathDefs) {
  const curve = new THREE.CatmullRomCurve3(def.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
  for (const p of curve.getSpacedPoints(def.length * 30)) pathPts.push(p);
}
const pathDist = (x, z) => { let m = Infinity; for (const p of pathPts) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < m) m = d; } return Math.sqrt(m); };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// --- Vatten (vattengeneratorn): en damm på en plan, öppen plats och en bäck som rinner in i den ---
const pondAt = (() => {
  let best = null;
  for (let x = -36; x <= 36; x += 4) for (let z = -36; z <= 36; z += 4) {
    if (Math.hypot(x, z) > 38) continue;
    const pd = pathDist(x, z);
    if (pd < 11) continue;
    const slope = Math.abs(baseHeight(x + 4, z) - baseHeight(x - 4, z)) + Math.abs(baseHeight(x, z + 4) - baseHeight(x, z - 4));
    const score = Math.min(pd, 16) - slope * 6;
    if (!best || score > best.score) best = { x, z, score };
  }
  return [best.x, best.z];
})();
// Bäcken kommer från det håll där den håller sig längst från stigarna, och slingrar sig in i dammen
const streamPoints = (() => {
  let best = null;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const d = 30 - i * 2.9, side = Math.sin(i * 1.1) * 2.2;
      pts.push([pondAt[0] + Math.cos(a) * d - Math.sin(a) * side, pondAt[1] + Math.sin(a) * d + Math.cos(a) * side]);
    }
    if (pts.some(([x, z]) => Math.hypot(x, z) > SIZE / 2 - 8)) continue;
    const score = Math.min(...pts.map(([x, z]) => pathDist(x, z)));
    if (!best || score > best.score) best = { pts, score };
  }
  return best.pts;
})();
const terrain = carveWater([
  { type: 'pond', center: pondAt },
  { type: 'stream', points: streamPoints, into: 0 },
], baseHeight);
const pond = terrain.bodies[0];
const heightAt = terrain.heightAt;
const dry = (x, z, r = 0) => terrain.wetAt(x, z) === 0 && terrain.wetAt(x + r + 1.2, z) === 0 && terrain.wetAt(x - r - 1.2, z) === 0
  && terrain.wetAt(x, z + r + 1.2) === 0 && terrain.wetAt(x, z - r - 1.2) === 0;
fp.heightAt = (x, z) => { const w = terrain.waterAt(x, z), h = heightAt(x, z); return w?.inside ? Math.max(h, w.level - 0.55) : h; }; // man vadar

const noise2 = (x, z) => 0.5 + 0.25 * Math.sin(x * 0.09 + Math.sin(z * 0.07) * 2) + 0.25 * Math.sin(z * 0.08 - x * 0.03 + 1.7);

W.setShadowArea(new THREE.Vector3(0, 0, 0), 70);

// --- Placering med regler ---
const catalog = await (await fetch('catalog.json', { cache: 'no-cache' })).json();
const items = catalog.rows.flatMap((r) => r.items);
const bySpecies = (list) => items.filter((i) => list.includes(i.species));
const groups = {
  trees: bySpecies(['oak', 'maple', 'ash', 'aspen', 'birch', 'cherry', 'willow', 'acacia', 'cypress', 'jpine', 'pine', 'fir']).filter((i) => !/autumn|spring/.test(i.name)),
  bushes: bySpecies(['bush', 'shrub', 'ballbush', 'moundbush', 'leafbush', 'petalbush', 'serratebush']),
  rocks: bySpecies(['stone', 'stones', 'mossy_stone']),
  boulders: bySpecies(['boulder', 'mossy_boulder']),
  underTrees: bySpecies(['fly_agaric', 'porcini', 'chanterelle', 'leafpile', 'creeper', 'ivy', 'stump', 'mossy_stump', 'log', 'mossy_log']),
  pebbles: bySpecies(['pebbles']),
};
const loaded = new Map();
const total = Object.values(groups).reduce((s, g) => s + g.length, 0);
let n = 0;
for (const g of Object.values(groups)) for (const it of g) {
  const root = await W.loadModel(it.model);
  loaded.set(it.name, { root, ...W.measure(root), it });
  status.textContent = `Laddar ${++n} / ${total}`;
}

const placedTrees = [], occupied = [];
const free = (x, z, r) => dry(x, z, r) && occupied.every((o) => (o.x - x) ** 2 + (o.z - z) ** 2 > (o.r + r) ** 2);
// Platta modeller utan stam (krypväxter, lövhögar, låga buskar) följer marken: varje vertex flyttas
// vertikalt lika mycket som marken skiljer sig från höjden vid modellens fot. Stammar står kvar lodrätt.
const _v = new THREE.Vector3(), _inv = new THREE.Matrix4();
function drape(obj) {
  obj.updateMatrixWorld(true);
  const base = obj.position.y;
  obj.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry = o.geometry.clone();
    const pos = o.geometry.attributes.position;
    _inv.copy(o.matrixWorld).invert();
    for (let i = 0; i < pos.count; i++) {
      _v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      _v.y += heightAt(_v.x, _v.z) - base;
      _v.applyMatrix4(_inv);
      pos.setXYZ(i, _v.x, _v.y, _v.z);
    }
    pos.needsUpdate = true;
    o.geometry.computeBoundingSphere();
    o.geometry.computeBoundingBox();
  });
}
function place(m, x, z, { scale = 1, sign = true } = {}) {
  const obj = m.root.clone();
  obj.position.set(x, heightAt(x, z), z);
  obj.rotation.y = rnd() * Math.PI * 2;
  obj.scale.setScalar(scale);
  scene.add(obj);
  if (!m.hasTrunk && m.size.y < 0.6 * Math.max(m.size.x, m.size.z)) drape(obj);
  const footprint = Math.max(m.size.x, m.size.z) * 0.5 * scale;
  occupied.push({ x, z, r: footprint * (m.hasTrunk ? 0.55 : 0.8) });
  W.colliders.push({ x, z, r: m.hasTrunk ? THREE.MathUtils.clamp(m.size.y * 0.035, 0.25, 0.7) * scale : footprint * 0.8 });
  if (sign && m.it) {
    const s = W.makeSign(m.it.name, m.it.tint, 1.2);
    const a = rnd() * Math.PI * 2, d = footprint + 0.6;
    s.position.set(x + Math.cos(a) * d, heightAt(x + Math.cos(a) * d, z + Math.sin(a) * d), z + Math.sin(a) * d);
    s.lookAt(x, s.position.y, z); s.rotateY(Math.PI);
    s.visible = false;
    scene.add(s);
  }
  return obj;
}
function scatter(list, count, rule, opts) {
  let tries = 0, made = 0;
  while (made < count && tries++ < count * 400) {
    const m = loaded.get(list[made % list.length].name);
    const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (SIZE / 2 - 8);
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    const r = Math.max(m.size.x, m.size.z) * 0.45;
    if (!rule(x, z, m) || !free(x, z, r)) continue;
    const obj = place(m, x, z, { scale: 0.9 + rnd() * 0.25, ...opts });
    if (list === groups.trees) placedTrees.push({ x, z, r });
    made++;
  }
}
// Träd i grupper en bit från stigarna
scatter(groups.trees, groups.trees.length * 2, (x, z) => pathDist(x, z) > 4.5 && noise2(x * 1.6, z * 1.6) > 0.42);
// Buskar längs stigkanterna och i bryn
scatter(groups.bushes, groups.bushes.length * 3, (x, z) => { const d = pathDist(x, z); return d > 1.8 && d < 5; });
// Under träden: svampar, lövhögar, krypväxter, stubbar
for (const t of placedTrees) {
  for (let k = 0; k < 2; k++) {
    const m = loaded.get(groups.underTrees[Math.floor(rnd() * groups.underTrees.length)].name);
    const a = rnd() * Math.PI * 2, d = t.r * (0.4 + rnd() * 0.7) + 1;
    const x = t.x + Math.cos(a) * d, z = t.z + Math.sin(a) * d;
    if (pathDist(x, z) > 1.4 && free(x, z, Math.max(m.size.x, m.size.z) * 0.3)) place(m, x, z, { scale: 0.9 + rnd() * 0.3, sign: false });
  }
}
// Stenar utspridda, bumlingar på kullarna
scatter(groups.rocks, 26, (x, z) => pathDist(x, z) > 1.3, { sign: false });
scatter(groups.boulders, 8, (x, z) => pathDist(x, z) > 3 && heightAt(x, z) > 0.4);
// Småsten i stigkanterna
scatter(groups.pebbles, 30, (x, z) => { const d = pathDist(x, z); return d > 1.1 && d < 2.2; }, { sign: false });

// Skogsmark under och kring träden, äng i öppna gläntor, gräs däremellan, stig överst
const nearTree = (x, z) => { let m = Infinity; for (const t of placedTrees) m = Math.min(m, Math.hypot(t.x - x, t.z - z) - t.r * 0.5); return m; };
function splatAt(x, z, p = 1 - smooth(1.0, 2.0, pathDist(x, z))) {
  const forest = 1 - smooth(1.5, 5.5, nearTree(x, z));
  const meadow = smooth(0.48, 0.66, noise2(x, z)) * (1 - forest);
  const grass = Math.max(0, 1 - forest - meadow);
  return [grass * (1 - p), meadow * (1 - p), forest * (1 - p), p];
}
const groundObj = await createGround(W, { size: SIZE, seg: SEG, terrain, surfaceAt: (x, z) => {
  const p = 1 - smooth(1.0, 2.0, pathDist(x, z));
  return { y: heightAt(x, z) - p * 0.06, splat: splatAt(x, z, p) }; // stigen ligger en aning nedtrampad
} });
createWaterMeshes(W, terrain);

const randomPoint = () => { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (SIZE / 2 - 10); return [Math.cos(a) * d, Math.sin(a) * d]; };
const flowers = ['daisy', 'poppy', 'buttercup', 'tulip', 'cornflower', 'lavender', 'lupine'];
// Blomsterdrivor: stora, avlånga fält där en art dominerar, täta i mitten och splittrade mot kanten
// (brus bryter upp formen), med lite inblandning av en andra art. Däremellan enstaka blommor.
const drifts = [];
for (let tries = 0; tries < 6000 && drifts.length < 12; tries++) {
  const [x, z] = randomPoint(), s = splatAt(x, z);
  if (s[1] + s[0] * 0.4 < 0.45 || pathDist(x, z) < 4 || nearTree(x, z) < 3) continue;
  if (drifts.some((d) => Math.hypot(d.x - x, d.z - z) < d.r + 8)) continue;
  drifts.push({ x, z, r: 4 + rnd() * 6, stretch: 1.4 + rnd() * 1.2, angle: rnd() * Math.PI,
    main: flowers[Math.floor(rnd() * flowers.length)], mix: flowers[Math.floor(rnd() * flowers.length)] });
}
// Hur mycket av en drivas inre en punkt ligger i (0 utanför, 1 i mitten); gräset blir kortare och glesare där
const driftAt = (x, z) => { let m = 0; for (const d of drifts) {
  const dx = x - d.x, dz = z - d.z, u = dx * Math.cos(d.angle) + dz * Math.sin(d.angle), v = -dx * Math.sin(d.angle) + dz * Math.cos(d.angle);
  m = Math.max(m, 1 - smooth(0.3, 1.0, Math.hypot(u / d.stretch, v) / d.r)); } return m; };

// --- Gräsfält: tuvor av strån som tar rotfärgen från marken, glesare i skugga under kronorna ---
const groundTex = groundObj.textures;
const shadeAt = (x, z) => { let m = 0; for (const t of placedTrees) m = Math.max(m, 1 - smooth(t.r * 0.35, t.r * 1.05, Math.hypot(t.x - x, t.z - z))); return m; };
const blocked = (x, z) => occupied.some((o) => (o.x - x) ** 2 + (o.z - z) ** 2 < (o.r * 0.55) ** 2);
const bald = (x, z) => smooth(0.22, 0.5, 0.5 + 0.3 * Math.sin(x * 0.53 + Math.sin(z * 0.41) * 2) + 0.2 * Math.sin(z * 0.67 - x * 0.29 + 2.1));
const field = createGrassField(W, {
  size: SIZE - 10, heightAt, splatAt, textures: groundTex,
  densityAt: (x, z, s) => {
    if (Math.hypot(x, z) > SIZE / 2 - 6 || blocked(x, z)) return 0;
    const shore = 1 - smooth(0.02, 0.5, terrain.wetAt(x, z)); // inget gräs i vattnet, glest i den våta kanten
    if (shore <= 0) return 0;
    return (s[0] + s[1] * 0.95 + s[2] * 0.3) * (0.35 + 0.65 * bald(x, z)) * (1 - 0.8 * shadeAt(x, z)) * (1 - 0.35 * driftAt(x, z)) * shore;
  },
  heightScaleAt: (x, z, s) => {
    const d = pathDist(x, z), edge = smooth(1.4, 2.2, d) * (1 - smooth(2.6, 4.5, d)); // högre gräs längs stigkanten
    return (0.24 + s[1] * 0.22) * (0.85 + 0.3 * noise2(x * 2.3, z * 2.3)) * (1 + 0.6 * edge) * (1 - 0.45 * shadeAt(x, z)) * (1 - 0.5 * driftAt(x, z));
  },
});

// --- Växter: blommor i ängen, högt gräs i kanter, vass i sänkor, ett litet sädesfält. Instansierade. ---
const plantItems = catalog.rows.flatMap((r) => r.items).filter((i) => i.model.includes('/plants/'));
const plantModels = new Map();
for (const it of plantItems) plantModels.set(it.species, await W.loadModel(it.model));
const plantPlaces = new Map();
const addPlant = (species, x, z, scale = 1) => {
  if (!plantModels.has(species) || blocked(x, z)) return;
  const w = terrain.waterAt(x, z), wetPlant = species === 'reed' || species === 'cattail', aquatic = species === 'water_lily' || species === 'pondweed';
  if (aquatic) { if (!w?.inside || w.depth < 0.35) return; } // näckros och nate i öppet vatten
  else if (wetPlant ? !w || w.wet < 0.05 || w.depth > 0.45 : !dry(x, z)) return; // vass och kaveldun i strandkanten, inget annat i vattnet
  const y = species === 'water_lily' ? w.level : heightAt(x, z); // näckrosen flyter på ytan
  if (!plantPlaces.has(species)) plantPlaces.set(species, []);
  plantPlaces.get(species).push({ x, y, z, yaw: rnd() * Math.PI * 2, scale: scale * (0.85 + rnd() * 0.3), splat: splatAt(x, z) });
};
for (const d of drifts) {
  const ca = Math.cos(d.angle), sa = Math.sin(d.angle), cell = 0.55;
  for (let u = -d.r * d.stretch; u <= d.r * d.stretch; u += cell) for (let v = -d.r; v <= d.r; v += cell) {
    const x = d.x + (u + (rnd() - 0.5) * cell) * ca - (v + (rnd() - 0.5) * cell) * sa;
    const z = d.z + (u + (rnd() - 0.5) * cell) * sa + (v + (rnd() - 0.5) * cell) * ca;
    const e = Math.hypot(u / d.stretch, v) / d.r;                   // 0 i mitten, 1 vid kanten
    const n = 0.5 + 0.35 * Math.sin(x * 0.9 + Math.sin(z * 0.7) * 2) + 0.25 * Math.sin(z * 1.3 - x * 0.4);
    const dens = (1 - smooth(0.25, 1.05, e + (n - 0.5) * 0.5)) * 0.95;
    if (rnd() > dens || pathDist(x, z) < 1.6) continue;
    addPlant(rnd() < 0.85 ? d.main : d.mix, x, z, 1.15 + (1 - e) * 0.3);
  }
}
for (let c = 0, tries = 0; c < 120 && tries < 8000; tries++) { // enstaka blommor i ängen
  const [x, z] = randomPoint(), s = splatAt(x, z);
  if (s[1] < 0.35 || pathDist(x, z) < 2) continue;
  addPlant(flowers[Math.floor(rnd() * flowers.length)], x, z); c++;
}
const tall = ['grass_tall', 'grass_seeded', 'feather_grass', 'grass_tuft'];
for (let i = 0, tries = 0; i < 260 && tries < 20000; tries++) { // högt gräs längs stigkanter och skogsbryn
  const [x, z] = randomPoint(), d = pathDist(x, z), s = splatAt(x, z);
  const edge = (d > 1.7 && d < 3.2) || (s[2] > 0.25 && s[2] < 0.6);
  if (!edge || rnd() > 0.5) continue;
  addPlant(tall[Math.floor(rnd() * tall.length)], x, z); i++;
}
// Vass och kaveldun i klungor längs dammens kant, med luckor så att man ser vattnet
for (let c = 0; c < 9; c++) {
  const a0 = (c / 9) * Math.PI * 2 + rnd() * 0.5, species = rnd() < 0.55 ? 'reed' : 'cattail';
  for (let i = 0; i < 9; i++) {
    const [x, z] = pond.shoreAt(a0 + (rnd() - 0.5) * 0.45, 0.84 + rnd() * 0.32);
    addPlant(species, x, z);
  }
}
for (let i = 0; i < 40; i++) { // näckrosor i små grupper, nate under ytan
  const [x, z] = pond.shoreAt(rnd() * Math.PI * 2, 0.2 + rnd() * 0.65);
  addPlant(i % 3 ? 'water_lily' : 'pondweed', x, z);
}
for (const s of terrain.bodies[1].S) if (rnd() < 0.18) { // tuvor av vass längs bäcken
  const side = rnd() < 0.5 ? -1 : 1, o = s.w * (0.8 + rnd() * 0.5) * side;
  addPlant(rnd() < 0.7 ? 'reed' : 'cattail', s.x - s.tz * o, s.z + s.tx * o, 0.8);
}
let fieldAt = null; // ett litet sädesfält på en öppen plats
for (let tries = 0; tries < 4000 && !fieldAt; tries++) {
  const [x, z] = randomPoint();
  if (pathDist(x, z) > 7 && nearTree(x, z) > 7 && Math.hypot(x, z) < SIZE / 2 - 18) fieldAt = [x, z];
}
if (fieldAt) for (let gx = -6; gx <= 6; gx += 0.45) for (let gz = -3.5; gz <= 3.5; gz += 0.45) {
  const x = fieldAt[0] + gx + (rnd() - 0.5) * 0.25, z = fieldAt[1] + gz + (rnd() - 0.5) * 0.25;
  addPlant(gx < 0 ? 'wheat' : 'barley', x, z);
}
let plantCount = 0;
for (const [sp, places] of plantPlaces) {
  instancePlants(W, plantModels.get(sp), places, { textures: groundTex, lodDist: sp === 'wheat' || sp === 'barley' ? [6, 22, 70] : [12, 28, 60] });
  plantCount += places.length;
}

// Start: på stigen, tittar in i parken
const start = pathPts[0];
fp.pos.set(start.x, heightAt(start.x, start.z), start.z);
fp.yaw = Math.atan2(-(pathPts[8].x - start.x), -(pathPts[8].z - start.z));
camera.position.set(0, 55, 75);
controls.target.set(0, 0, 0);
status.textContent = `${W.signs.length} växter och props, ${plantCount} instansierade växter och ${Math.round(field.blades / 1000)} 000 grässtrån`;

document.getElementById('lod').onchange = (e) => W.setLod(Number(e.target.value));
document.getElementById('wind').oninput = (e) => (W.wind.uWind.value = Number(e.target.value));
document.getElementById('labels').onchange = (e) => W.signs.forEach((s) => (s.visible = e.target.checked));
// Prestandamätare: bilder per sekund, tid per bild, ritanrop och trianglar (skuggpasset inräknat)
{
  let frames = 0, t0 = performance.now();
  const el = document.getElementById('perf'), info = W.renderer.info.render;
  W.onFrame(() => {
    frames++;
    const now = performance.now();
    if (now - t0 < 500) return;
    const fps = (frames * 1000) / (now - t0);
    el.textContent = `${fps.toFixed(0)} fps · ${(1000 / fps).toFixed(1)} ms · ${info.calls} anrop · ${(info.triangles / 1e6).toFixed(2)} M tri`;
    frames = 0; t0 = now;
  });
}
// Gräsreglagen ändrar shaderns uniforms direkt
const U = field.uniforms, $ = (id) => document.getElementById(id), num = (id) => Number($(id).value);
const bind = (id, fn) => { $(id).oninput = fn; fn(); };
bind('gTipA', () => U.uTipA.value.set($('gTipA').value));
bind('gTipB', () => U.uTipB.value.set($('gTipB').value));
bind('gGroundMix', () => (U.uGroundMix.value = num('gGroundMix')));
bind('gBright', () => (U.uBright.value = num('gBright')));
bind('gHeight', () => (U.uHeight.value = num('gHeight')));
bind('gDensity', () => (U.uDensity.value = num('gDensity')));
bind('gRange', () => U.uFade.value.set(num('gRange') * 0.57, num('gRange')));
bind('gDir', () => { const a = (num('gDir') * Math.PI) / 180; U.uWindDir.value.set(Math.cos(a), Math.sin(a)); });
bind('gGustLen', () => (U.uGust.value.x = (2 * Math.PI) / num('gGustLen')));
bind('gGustSpeed', () => (U.uGust.value.y = num('gGustSpeed') * U.uGust.value.x / 0.45));
</script>
</body>
</html>
