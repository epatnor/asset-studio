<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darrowmere Monitor</title>
<style>
  :root {
    --bg: #0f1215; --panel: #161a1f; --panel2: #1b2027; --line: #262c34; --text: #d7dce2; --muted: #7d8794; --dim: #4b5563;
    --green: #2bd46b; --teal: #1fb5b0; --blue: #4f8dff; --amber: #f2a93b; --red: #ef4f5f; --violet: #a77bff; --track: #232a32; --cloud: #7cc7ff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef0f3; --panel: #ffffff; --panel2: #f6f7f9; --line: #dde1e6; --text: #1d2228; --muted: #687280; --dim: #a3abb5;
      --green: #16a34a; --teal: #0d9488; --blue: #2563eb; --amber: #d97706; --red: #dc2626; --violet: #7c3aed; --track: #e6e9ed; --cloud: #0284c7;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 12.5px/1.35 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  header { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .brand { font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  .pill { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, var(--line)); }
  .pill.run { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); }
  .pill.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.run .dot { animation: pulse 1.4s infinite; }
  /* Modellen som kör: bara namnet, stilla (det är ComfyUI-pillret som blinkar, och detaljerna finns i jobblistan) */
  .pill.model { color: var(--text); } .pill.model .dot { display: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }
  #age { width: 104px; text-align: right; color: var(--muted); }

  main { padding: 12px 16px 20px; display: grid; gap: 10px; max-width: 1600px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .ph { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
  .ph .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .pb { padding: 10px 12px; }

  /* Mätare */
  .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .group .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gauge { height: 176px; padding: 6px 6px 4px; display: grid; place-items: center; min-width: 0; }
  .dial { position: relative; width: 164px; height: 164px; max-width: 100%; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .dial .arc { transition: stroke-dasharray .6s cubic-bezier(.3, .7, .3, 1), stroke .4s; }
  .dial .face { position: absolute; inset: 27px; border-radius: 50%; display: grid; grid-template-rows: 18px 34px 16px 15px 15px; align-content: center; justify-items: center;
                background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--panel2) 70%, transparent), transparent 70%); }
  .dial .lbl { color: var(--muted); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .dial .big { font-size: 29px; font-weight: 700; line-height: 34px; letter-spacing: -.02em; }
  .dial .big small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .dial .unit { color: var(--muted); font-size: 10px; }
  .dial .m1 { font-size: 11.5px; color: var(--text); max-width: 108px; }
  .dial .m2 { font-size: 11px; color: var(--muted); max-width: 108px; }

  /* Jobb */
  .ph .phinfo { margin-left: 10px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ph .actions { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; gap: 6px; }
  .ph .actions button { height: 24px; padding: 0 10px; font-size: 11.5px; }
  .rowprog { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; }
  .rowprog .prog { height: 6px; }
  .rowprog span { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
  /* Pågående jobb: ett kort med två rader ovanför listan, fast höjd */
  .cur { height: 62px; margin: 10px 12px 4px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--panel2); display: grid; grid-template-rows: 22px 20px; gap: 4px; }
  .cur.on { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
  .cur1, .cur2 { display: grid; align-items: center; gap: 12px; min-width: 0; }
  .cur1 { grid-template-columns: auto minmax(0, 1fr) auto auto; font-size: 14px; font-weight: 650; }
  @media (max-width: 900px) { .legend2 { display: none; } }
  .cur2 { grid-template-columns: 170px minmax(0, 1fr) 150px; }
  .curtime { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .curphase, .curtiming { color: var(--muted); font-size: 11.5px; }
  .curtiming { text-align: right; }
  /* Pipeline: en tredje rad med alla delsteg när jobbet hör till en hel tillgång (3D, texturer, rigg …) */
  .cur.pipe { height: 90px; grid-template-rows: 22px 20px 20px; }
  .cur3 { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; min-width: 0; }
  .cur3[hidden] { display: none; }
  .pname { color: var(--muted); font-size: 11.5px; }
  .pchips { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
  .pchip { flex: 1 1 0; min-width: 0; height: 20px; line-height: 18px; border-radius: 4px; border: 1px solid var(--line); padding: 0 6px;
           font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--panel); }
  .pchip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 0;
                   background: var(--track); }
  .pchip.done { color: var(--text); } .pchip.done::before { background: var(--green); }
  .pchip.running { color: var(--text); border-color: var(--blue); }
  .pchip.running::before { background: var(--blue); animation: blink 1s steps(1, end) infinite; }
  .pchip.queued::before { background: none; box-shadow: inset 0 0 0 1.5px var(--amber); }
  .pchip.failed { border-color: var(--red); } .pchip.failed::before { background: var(--red); }
  .pchip.skipped { text-decoration: line-through; }
  .pchip.waiting::before { background: var(--amber); }
  .pchip.viewable { cursor: pointer; } .pchip.viewable:hover { border-color: var(--blue); color: var(--text); }
  .pchip .vw { margin-left: 4px; color: var(--muted); font-size: 10px; }
  .pchip.warning { border-color: color-mix(in srgb, var(--amber) 60%, var(--line)); } .pchip.warning::before { background: var(--amber); }
  .pchip.rejected { border-color: color-mix(in srgb, #fb923c 60%, var(--line)); } .pchip.rejected::before { background: #fb923c; }
  /* Molnsteg (Meshy, Tripo, DeepSeek): streckad kant i molnfärg och ett moln före namnet; de kostar krediter */
  .pchip.cloud { border-style: dashed; border-color: color-mix(in srgb, var(--cloud) 55%, var(--line)); }
  .pchip.cloud.running { border-color: var(--cloud); border-style: dashed; }
  .pchip.cloud.running::before { background: var(--cloud); }
  .pchip .ic { color: var(--cloud); margin-right: 3px; }
  .pchip.approval { border-color: var(--amber); color: var(--text); } .pchip.approval::before { background: var(--amber); animation: blink 1s steps(1, end) infinite; }
  .cloudtag { display: inline-block; height: 16px; line-height: 15px; padding: 0 5px; margin-right: 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
              color: var(--cloud); border: 1px dashed color-mix(in srgb, var(--cloud) 60%, transparent); vertical-align: 1px; }
  .cur.cloudrun { border-style: dashed; border-color: var(--cloud); }
  .cur.cloudrun .legend2 { visibility: hidden; }
  .cur.needs { border-color: var(--amber); border-style: solid; }
  .cur.needs .legend2 { visibility: hidden; }
  /* Approve på kortet: liten, i radens höjd, gul kontur; fylld först när man håller över den. I dialogen är den större */
  button.approve { height: 20px; line-height: 18px; padding: 0 9px; font-size: 11px; font-weight: 600; border-radius: 5px;
                   background: transparent; border: 1px solid var(--amber); color: var(--amber); vertical-align: middle; }
  button.approve:hover { background: var(--amber); color: #1b1408; border-color: var(--amber); }
  dialog.ask button.approve { height: 30px; padding: 0 14px; font-size: 12.5px; background: var(--amber); color: #1b1408; }
  dialog.ask { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 18px 20px; width: min(420px, 92vw); }
  dialog.ask::backdrop { background: rgb(0 0 0 / .55); }
  dialog.ask h3 { margin: 0 0 10px; font-size: 15px; }
  dialog.ask .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12.5px; margin: 8px 0 14px; }
  dialog.ask .kv span:nth-child(odd) { color: var(--muted); }
  dialog.ask .btns { display: flex; justify-content: flex-end; gap: 8px; }  /* nodfärgerna gäller ComfyUI-jobb, inte molnsteg */
  .steps { display: flex; gap: 3px; height: 12px; overflow: hidden; align-items: center; }
  .steps i { flex: 0 1 12px; min-width: 3px; height: 12px; border-radius: 2px; background: var(--track); }
  /* Solida färger per slags steg; den pågående blinkar */
  .steps i.k-load { background: #f472b6; } .steps i.k-text { background: var(--violet); } .steps i.k-sample { background: var(--blue); }
  .steps i.k-vae { background: var(--amber); } .steps i.k-mesh { background: var(--teal); } .steps i.k-save { background: var(--green); }
  .steps i.k-other { background: #c8ced6; } .steps i.k-cached { background: var(--track); }
  /* Cachade steg: grå fyllning med en kant i stegets färg */
  .steps i.b-load { box-shadow: inset 0 0 0 1px #f472b6; } .steps i.b-text { box-shadow: inset 0 0 0 1px var(--violet); }
  .steps i.b-sample { box-shadow: inset 0 0 0 1px var(--blue); } .steps i.b-vae { box-shadow: inset 0 0 0 1px var(--amber); }
  .steps i.b-mesh { box-shadow: inset 0 0 0 1px var(--teal); } .steps i.b-save { box-shadow: inset 0 0 0 1px var(--green); }
  .steps i.b-other { box-shadow: inset 0 0 0 1px #c8ced6; }
  .steps i.now { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 50% { background: var(--track); } }
  .legend2 { display: flex; gap: 10px; color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; }
  .legend2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .nowname { font-size: 16px; font-weight: 650; }
  .nowprog { display: grid; grid-template-rows: 8px 16px; gap: 5px; min-width: 0; }
  .nowstage { color: var(--muted); font-size: 11.5px; }
  .nowtime { color: var(--muted); text-align: right; }
  .prog { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .prog > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--blue)); transition: width .5s; }
  .msgline { height: 0; color: var(--muted); padding: 0 12px; font-size: 11.5px; transition: height .2s; }
  .msgline.show { height: 22px; line-height: 22px; }
  .jobs .tablebox { height: auto; overflow: hidden; }  /* högst 5 rader, resten finns i History */
  .actions { display: flex; gap: 8px; align-items: center; }
  .tag.btn { cursor: pointer; }
  .tag.btn:hover { border-color: currentColor; }  /* klickbar: kanten tar statusens egen färg */
  .pop { position: fixed; z-index: 10; max-width: min(560px, calc(100vw - 16px)); max-height: min(260px, calc(100vh - 16px)); overflow: auto; padding: 10px 12px;
         background: var(--panel2); border: 1px solid color-mix(in srgb, var(--red) 45%, var(--line)); border-radius: 8px;
         box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .pop b { display: block; font-family: system-ui, sans-serif; font-size: 12px; color: var(--red); margin-bottom: 6px; }

  /* Diagrammet */
  .chartwrap { height: 168px; padding: 8px 12px 4px; display: grid; grid-template-rows: minmax(0, 1fr) 18px; gap: 2px; }
  .legend { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 11px; overflow: hidden; white-space: nowrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .legend b { color: var(--text); font-weight: 600; display: inline-block; min-width: 30px; text-align: right; }
  .spark .cv { position: relative; min-height: 0; overflow: hidden; }
  button { font: inherit; height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--blue); }
  button.armed { border-color: var(--red); color: var(--red); }
  #msg { color: var(--muted); margin-left: 4px; }

  .gauge[data-k] { cursor: pointer; border-radius: 8px; }
  .gauge[data-k]:hover { background: color-mix(in srgb, var(--panel2) 60%, transparent); }
  .pop.info { border-color: var(--line); font-family: inherit; white-space: normal; width: 300px; font-size: 12px; max-height: calc(100vh - 16px); }
  td:last-child { padding: 0 6px; text-overflow: clip; }
  .pop.info b { color: var(--text); font-size: 13px; }
  .drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; height: 22px; align-items: center; border-bottom: 1px dashed var(--line); }
  .drow span:first-child { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dsub { margin: 10px 0 4px; color: var(--muted); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
  .dbars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; height: 34px; }
  .dbars > div { position: relative; background: var(--track); border-radius: 3px; overflow: hidden; }
  .dbars > div > div { position: absolute; left: 0; right: 0; bottom: 0; background: var(--teal); }
  .hwrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; height: 20px; align-items: center; border-bottom: 1px dashed var(--line); }
  .hwrow span:first-child { color: var(--muted); }
  .cores { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; height: 30px; margin-top: 6px; }
  .core { position: relative; background: var(--track); border-radius: 3px; overflow: hidden; }
  .core > div { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--teal); transition: height .5s; }

  /* Diagram */
  .cv { position: relative; min-height: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Nederst */
  .tablebox { height: 262px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { height: 28px; padding: 0 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; font-size: 11.5px; z-index: 1; }
  td.err { color: var(--red); font-size: 11.5px; }
  .tag { display: inline-block; height: 18px; line-height: 18px; padding: 0 7px; border-radius: 4px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line); }
  .tag.ok { color: var(--green); } .tag.bad { color: var(--red); } .tag.run { color: var(--blue); }
  /* Larmnivåer: pass grön, warning gul (nära godkänd), fail orange (underkänd), error röd (tekniskt fel) */
  .tag.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); }
  .tag.fail { color: #fb923c; border-color: color-mix(in srgb, #fb923c 45%, var(--line)); }
  .tag.btn.warn:hover, .tag.btn.fail:hover { border-color: currentColor; }
  button.view { height: 20px; padding: 0 8px; font-size: 11px; margin-left: 6px; }
  button.ack { height: 20px; padding: 0 7px; font-size: 11px; color: var(--muted); }
  button.ack:hover { color: var(--green); border-color: var(--green); }
  .ph button.ack { margin-left: 10px; text-transform: none; letter-spacing: 0; }
  pre { margin: 0; height: 262px; overflow: auto; padding: 8px 12px; font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); white-space: pre; }
  .error { color: var(--red); }
  .sub { color: var(--muted); font-weight: 400; }
  .dlv { display: inline-block; width: 14px; color: var(--dim); font-weight: 700; }
  .dlv.ok { color: var(--green); }
  body.offline main { opacity: .45; filter: grayscale(1); pointer-events: none; transition: opacity .4s; }
  body.offline .steps i.now, body.offline .spin { animation: none; }
  .jobcell { cursor: pointer; }
  .jobcell:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
  .pop.info.wide { width: 520px; }
  .dsub button.copy { height: 18px; padding: 0 7px; font-size: 10.5px; margin-left: 6px; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
  .ptext { white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text);
           background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; user-select: text; }
  .spin { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; border-radius: 50%;
          border: 2px solid color-mix(in srgb, var(--blue) 30%, transparent); border-top-color: var(--blue); animation: spin .8s linear infinite; }
  .spin.big { width: 13px; height: 13px; margin-right: 9px; vertical-align: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1100px) {
    .gauges { grid-template-columns: minmax(0, 1fr); }
    .sparks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .hwgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hw { height: auto; }
    .now { grid-template-columns: minmax(0, 1fr) 90px; height: auto; padding: 10px 12px; row-gap: 8px; }
    .now .nowprog { grid-column: 1 / -1; grid-row: 2; }
    .now .actions { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    main { padding: 10px 16px; }
    header { padding: 0 16px; overflow: hidden; }
    .sparks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #uptimePill, #age { display: none; }
    .hwgrid { grid-template-columns: minmax(0, 1fr); }
    .hw { height: auto; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">DARROWMERE</span>
  <span class="pill" id="netPill"><span class="dot"></span><b>connecting</b></span>
  <span class="pill" id="comfyPill"><span class="dot"></span><span class="ell" style="max-width:260px">ComfyUI</span></span>
  <span class="pill" id="modelPill" hidden><span class="dot"></span><span class="ell" style="max-width:200px" id="modelName"></span></span>
  <span class="pill" id="uptimePill">up <b id="uptime">–</b></span>
  <span class="pill num" id="netPill2" title="Network traffic"><span id="netRate" style="display:inline-block;width:150px">–</span></span>
  <span class="spacer"></span>
  <span class="num" id="age"></span>
  <button id="acctBtn" title="Accounts and password"><span id="meName">Account</span></button>
  <button id="outBtn" title="Log out">Log out</button>
  <button id="setBtn" title="Local or cloud generation, AI review, budget and API keys">Settings</button>
  <button id="histBtn" title="All jobs, also acknowledged ones">History</button>
  <button id="logBtn" title="Open the ComfyUI log in its own window">Log</button>
</header>

<main>
  <section class="gauges" id="gauges"></section>

  <section class="panel jobs">
    <div class="ph">Jobs<span class="phinfo num" id="queueInfo"></span>
      <span class="actions">
        <button data-action="interrupt" title="Stop the running job">Stop</button>
        <button data-action="clear" title="Remove waiting jobs">Clear queue</button>
        <button data-action="restart" title="Restart the ComfyUI service">Restart</button>
        <button class="ack" id="ackAll" title="Acknowledge every finished job" hidden>✓ all</button>
      </span>
    </div>
    <div class="msgline ell" id="msg"></div>
    <div class="cur" id="cur">
      <div class="cur1"><span id="curIcon"></span><span class="ell" id="curName">Idle</span>
        <span class="legend2" title="Colour of each step"><span><i style="background:#f472b6"></i>load</span><span><i style="background:var(--violet)"></i>prompt</span><span><i style="background:var(--blue)"></i>sampling</span><span><i style="background:var(--amber)"></i>VAE</span><span><i style="background:var(--teal)"></i>3D</span><span><i style="background:var(--green)"></i>save</span><span><i style="background:var(--track);box-shadow:inset 0 0 0 1px var(--muted)"></i>cached</span></span>
        <span class="num curtime" id="curTime"></span></div>
      <div class="cur2"><span class="ell curphase num" id="curPhase"></span><span class="steps" id="curSteps"></span><span class="num curtiming ell" id="curTiming"></span></div>
      <div class="cur3" id="curPipe" hidden><span class="ell pname num" id="pipeName"></span><span class="pchips" id="pipeSteps"></span></div>
    </div>
    <div class="tablebox">
      <table>
        <colgroup><col style="width:64px"><col style="width:64px"><col><col style="width:96px"><col style="width:96px"><col style="width:200px"><col style="width:40px"></colgroup>
        <thead><tr><th>Started</th><th>Finished</th><th>Job</th><th>Status</th><th>Time</th><th>Output</th><th></th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>


  <section class="panel">
    <div class="ph">Last 10 minutes<span class="right">percent of capacity</span></div>
    <div class="chartwrap">
      <div class="cv"><canvas id="chart"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>
</main>
<div class="pop" id="pop" hidden></div>
<dialog class="ask" id="approveDlg">
  <h3>Approve a cloud step?</h3>
  <div class="kv" id="approveKv"></div>
  <div class="btns"><button id="approveNo">Not now</button><button class="approve" id="approveYes">Approve and run</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const css = () => getComputedStyle(document.documentElement);
const fmtB = b => b >= 1e12 ? (b / 1e12).toFixed(2) + " TB" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB";
const fmtRate = b => b >= 1e6 ? (b / 1e6).toFixed(1) + " MB/s" : (b / 1e3).toFixed(0) + " kB/s";
const fmtDur = s => s == null ? "–" : s < 60 ? s.toFixed(0) + " s" : s < 3600 ? Math.floor(s / 60) + " min " + String(Math.round(s % 60)).padStart(2, "0") + " s" : (s / 3600).toFixed(1) + " h";
const clock = t => t ? new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "–";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const level = p => p > 90 ? "--red" : p > 75 ? "--amber" : null;

// Rattarna byggs en gång och uppdateras sedan på plats, så att ingenting byter storlek.
// En båge på 270 grader med öppning nedåt; RAM har en inre tunn båge för växlingsutrymmet.
const GROUPS = [["Processor and memory", [["cpu", "CPU", "--teal"], ["ram", "RAM", "--amber"]]],
                ["Graphics", [["gpu", "GPU", "--green"], ["vram", "VRAM", "--violet"]]],
                ["Disks", [["root", "System", "--blue"], ["disk", "Data", "--teal"]]]];
const R = 70, C = 2 * Math.PI * R, ARC = C * 0.75, R2 = 58, C2 = 2 * Math.PI * R2, ARC2 = C2 * 0.75;
$("gauges").innerHTML = GROUPS.map(([title, dials]) => `
  <div class="panel group" title="${title}"><div class="pair">${dials.map(dialHtml).join("")}</div></div>`).join("");
function dialHtml([k, label, col]) { return `
  <div class="gauge" data-k="${k}" title="Click for details">
    <div class="dial">
      <svg viewBox="0 0 164 164">
        <defs><linearGradient id="gr_${k}" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" id="gs0_${k}" stop-color="var(${col})" stop-opacity=".55"/><stop offset="1" id="gs1_${k}" stop-color="var(${col})"/>
        </linearGradient></defs>
        <g transform="rotate(135 82 82)">
          <circle cx="82" cy="82" r="${R}" fill="none" stroke="var(--track)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${ARC} ${C}"/>
          <circle class="arc" id="g_${k}" cx="82" cy="82" r="${R}" fill="none" stroke="url(#gr_${k})" stroke-width="11" stroke-linecap="round"
                  stroke-dasharray="0 ${C}" style="filter: drop-shadow(0 0 5px color-mix(in srgb, var(${col}) 45%, transparent))"/>
          ${k === "ram" ? `<circle cx="82" cy="82" r="${R2}" fill="none" stroke="var(--track)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${ARC2} ${C2}"/>
          <circle class="arc" id="g_swap" cx="82" cy="82" r="${R2}" fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 ${C2}"/>` : ""}
        </g>
      </svg>
      <div class="face">
        <div class="lbl">${label}</div>
        <div class="big num"><span id="gv_${k}">–</span><small>%</small></div>
        <div class="unit ell" id="gu_${k}"></div>
        <div class="m1 ell num" id="gm1_${k}">–</div>
        <div class="m2 ell num" id="gm2_${k}"></div>
      </div>
    </div>
  </div>`; }
function setGauge(k, pct, unit, m1, m2, colorVar) {
  const p = pct == null || isNaN(pct) ? null : Math.max(0, Math.min(100, pct));
  $("g_" + k).setAttribute("stroke-dasharray", `${p == null ? 0 : ARC * p / 100} ${C}`);
  const col = `var(${level(p) || colorVar})`;
  $("gs0_" + k).setAttribute("stop-color", col); $("gs1_" + k).setAttribute("stop-color", col);
  $("gv_" + k).textContent = p == null ? "–" : p.toFixed(0);
  $("gu_" + k).textContent = unit; $("gm1_" + k).textContent = m1; $("gm2_" + k).textContent = m2;
}

// Klick på en ratt öppnar en ruta med mer om just den delen; den uppdateras så länge den är öppen
let openDial = null;
const row = (a, b) => `<div class="drow"><span>${a}</span><span class="num">${b}</span></div>`;
const bars = vals => `<div class="dbars">${vals.map((v, i) => `<div title="thread ${i}: ${v.toFixed(0)} %"><div style="height:${v}%"></div></div>`).join("")}</div>`;
function detailHtml(k, s) {
  const p = s.probe, g = p.gpus[0] || {}, m = p.mem, procs = p.procs.filter(x => x.name !== "ps");
  const gb = b => (b / 1073741824).toFixed(1) + " GB";
  const procRows = (by) => [...procs].sort((a, b) => b[by] - a[by]).slice(0, 4)
    .map(x => row(esc(x.name), by === "cpu" ? `${x.cpu.toFixed(0)} % · ${fmtB(x.rss_mb * 1e6)}` : `${fmtB(x.rss_mb * 1e6)} · ${x.cpu.toFixed(0)} %`)).join("");
  if (k === "cpu") return `<b>CPU</b>${row("Load", p.cpu.toFixed(0) + " %")}${row("Load average 1/5/15", p.load.join(" / "))}
    <div class="dsub">Threads</div>${bars(p.cores)}
    <div class="dsub">Temperatures</div>${p.temps.filter(t => t.chip === "coretemp").map(t => row(esc(t.label), t.c.toFixed(0) + " °C")).join("")}
    <div class="dsub">Busiest processes</div>${procRows("cpu")}`;
  if (k === "ram") return `<b>RAM</b>${row("Used", `${gb(m.total - m.avail)} of ${gb(m.total)}`)}${row("Available", gb(m.avail))}
    ${row("Swap used", `${gb(m.swap_total - m.swap_free)} of ${gb(m.swap_total)}`)}
    <div class="dsub">Largest processes</div>${procRows("rss_mb")}`;
  if (k === "gpu") return `<b>${esc(g.name || "GPU")}</b>${row("Load", (g.util ?? "–") + " %")}${row("Temperature", (g.temp ?? "–") + " °C")}
    ${row("Fan", g.fan != null ? g.fan + " %" : "n/a")}${row("Clock", (g.clock ?? "–") + " MHz")}
    ${row("Power", g.power != null ? g.power.toFixed(0) + " W" : "not reported")}${row("Power limit", (g.power_limit ?? "–") + " W")}`;
  if (k === "vram") return `<b>VRAM</b>${row("Used", `${(g.mem_used / 1024).toFixed(2)} GB`)}${row("Free", `${((g.mem_total - g.mem_used) / 1024).toFixed(2)} GB`)}
    ${row("Total", `${(g.mem_total / 1024).toFixed(1)} GB`)}${(s.comfy?.devices || []).map(dv => row("ComfyUI sees", `${gb(dv.vram_free)} free`)).join("")}`;
  const d = p.disks.find(x => x.mount === (k === "root" ? "/" : "/data"));
  if (!d) return "<b>Disk</b>no data";
  const temp = k === "disk" ? p.temps.filter(t => t.chip === "nvme").map(t => row("Temperature " + esc(t.label), t.c.toFixed(0) + " °C")).join("") : "";
  return `<b>${k === "root" ? "System disk · 840 EVO" : "Data disk · NVMe"}</b>${row("Mounted at", d.mount)}
    ${row("Used", `${fmtB(d.total - d.free)} of ${fmtB(d.total)}`)}${row("Free", fmtB(d.free))}${temp}`;
}
function showDetail(k, s) {
  const pop = $("pop"), card = document.querySelector(`.gauge[data-k="${k}"]`);
  pop.className = "pop info"; pop.innerHTML = detailHtml(k, s); pop.hidden = false;
  const r = card.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  placePop(pop, { left: r.left + r.width / 2 - pw / 2, top: r.top, bottom: r.bottom });
}
document.addEventListener("click", e => {
  const card = e.target.closest(".gauge[data-k]");
  if (!card) return;
  e.stopPropagation();
  if (openDial === card.dataset.k) { openDial = null; $("pop").hidden = true; return; }
  openDial = card.dataset.k;
  if (lastStatus?.probe) showDetail(openDial, lastStatus);
}, true);

// Ett gemensamt diagram för de senaste tio minuterna, med en rad förklaring under
const SERIES = [["cpu", "CPU", "--teal"], ["ram", "RAM", "--amber"], ["swap", "Swap", "--blue"], ["gpu", "GPU", "--green"], ["vram", "VRAM", "--violet"]];
$("legend").innerHTML = SERIES.map(([k, l, c]) => `<span><i style="background:var(${c})"></i>${l} <b class="num" id="lg_${k}">–</b></span>`).join("");

let lastRows = "";
// Statusens nivå: pass och success gröna, warning gul, fail orange, allt annat (error, failed) rött
const levelClass = st => st === "success" || st === "pass" ? "ok" : st === "warning" ? "warn" : st === "fail" ? "fail" : "bad";
const jobLabel = x => `${x.cloud ? '<span class="cloudtag" title="Ran in the cloud and cost credits">☁</span>' : ""}${esc(x.name)}${x.title ? `<span class="sub"> · ${esc(x.title.replace(/^[\w.-]+: /, ""))}</span>` : ""}`;
function pill(id, cls, html) { const el = $(id); el.className = "pill " + cls; el.innerHTML = html; }

$("logBtn").onclick = () => window.open("/log", "darrowmere-log", "width=1100,height=720");
$("setBtn").onclick = () => window.open("/settings", "darrowmere-settings", "width=860,height=900");
$("acctBtn").onclick =() => window.open("/accounts", "darrowmere-accounts", "width=720,height=640");
$("outBtn").onclick = async () => { await fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); location.href = "/login"; };
fetch("/api/auth-state").then(r => r.json()).then(a => { if (a.user) $("meName").textContent = a.user; }).catch(() => {});
$("histBtn").onclick = () => window.open("/history", "darrowmere-history", "width=1000,height=720");
document.addEventListener("click", async e => {
  const b = e.target.closest("button.ack");
  if (!b) return;
  b.disabled = true;
  await fetch("/api/ack/" + (b.id === "ackAll" ? "all" : b.dataset.ack), { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  tick();
});
function render(s) {
  const p = s.probe, c = s.comfy, age = s.now - s.updated, online = s.online && age < 45;
  pill("netPill", online ? "ok" : "bad", `<span class="dot"></span><b>${online ? "Online" : "Darrowmere offline"}</b>`);
  $("age").textContent = s.slow ? "Darrowmere is busy · waiting for an answer" : s.updated ? `updated ${Math.max(0, age).toFixed(0)} s ago` : "";
  // Panelen svarar men Darrowmere gör det inte: tona ned, visa sedan när, töm rattarna och låt diagrammet flatlina
  document.body.classList.toggle("offline", !online);
  if (!online) {
    const since = s.offline_since ? new Date(s.offline_since * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "–";
    pill("comfyPill", "bad", `<span class="dot"></span><span class="ell" style="max-width:260px">offline since ${since} · retrying</span>`);
    $("modelPill").hidden = true;
    if (s.offline_since) $("age").textContent = `no answer for ${fmtDur(s.now - s.offline_since)}`;
    GROUPS.forEach(([, dials]) => dials.forEach(([k]) => setGauge(k, null, "", "–", "", "--muted")));
    $("g_swap").setAttribute("stroke-dasharray", `0 ${C2}`);
    $("netRate").textContent = "–";
    drawSparks(s.history || []);
    return;
  }
  if (!p) { pill("netPill", "bad", `<span class="dot"></span><b class="ell" style="max-width:300px">${esc(s.probe_error || "no data yet")}</b>`); return; }
  $("uptime").textContent = fmtDur(p.uptime);

  const m = p.mem, g = p.gpus[0] || {}, d = p.disks.find(x => x.mount === "/data"), root = p.disks.find(x => x.mount === "/");
  const ramUsed = m.total - m.avail, swUsed = m.swap_total - m.swap_free;
  const cpuT = p.temps.filter(t => t.chip === "coretemp").map(t => t.c);
  const gb = mb => (mb / 1024).toFixed(1);
  setGauge("cpu", p.cpu, `${p.cores.length} threads`, cpuT.length ? `${Math.max(...cpuT).toFixed(0)} °C` : "–", `load ${p.load[0]}`, "--teal");
  setGauge("gpu", g.util, g.name ? g.name.replace("NVIDIA ", "") : "no GPU", g.temp != null ? `${g.temp} °C · fan ${g.fan ?? "–"} %` : "–", g.clock != null ? `${g.clock} MHz` : "", "--green");
  setGauge("ram", 100 * ramUsed / m.total, "inner ring: swap", `${gb(ramUsed / 1048576)} / ${gb(m.total / 1048576)} GB`,
           m.swap_total ? `swap ${gb(swUsed / 1048576)} / ${gb(m.swap_total / 1048576)} GB` : "no swap", "--amber");
  const sp = m.swap_total ? Math.min(100, 100 * swUsed / m.swap_total) : 0;
  $("g_swap").setAttribute("stroke-dasharray", `${ARC2 * sp / 100} ${C2}`);
  $("g_swap").setAttribute("stroke", `var(${level(sp) || "--blue"})`);
  setGauge("vram", g.mem_total ? 100 * g.mem_used / g.mem_total : null, "graphics memory", g.mem_total ? `${gb(g.mem_used)} / ${gb(g.mem_total)} GB` : "–", "", "--violet");
  setGauge("root", root ? 100 * (root.total - root.free) / root.total : null, "840 EVO · /", root ? `${fmtB(root.free)} free` : "–", root ? `of ${fmtB(root.total)}` : "", "--blue");
  setGauge("disk", d ? 100 * (d.total - d.free) / d.total : null, "NVMe · /data", d ? `${fmtB(d.free)} free` : "–", d ? `of ${fmtB(d.total)}` : "", "--teal");
  const r = Object.entries(s.rates || {}).reduce((a, [, v]) => ({ rx: a.rx + v.rx, tx: a.tx + v.tx }), { rx: 0, tx: 0 });
  $("netRate").textContent = `↓ ${fmtRate(r.rx)}  ↑ ${fmtRate(r.tx)}`;
  if (openDial) showDetail(openDial, s);

  if (c) {
    const run = c.running[0], pr = c.progress;
    pill("comfyPill", p.service !== "active" ? "bad" : run ? "run" : "ok",
         `<span class="dot"></span><span class="ell" style="max-width:260px">${p.service !== "active" ? "ComfyUI " + esc(p.service) : run ? "ComfyUI running" : "ComfyUI idle"}</span>`);
    // Plattformen och modellen var för sig: ComfyUI ovan, modellen som kör (Krea-2, Pixal3D, UltraTex …) här
    $("modelPill").hidden = !run;
    if (run) { $("modelPill").className = "pill model"; $("modelName").textContent = run.name; }
    $("queueInfo").textContent = run || c.pending.length ? `${c.running.length} running · ${c.pending.length} queued` : "idle";
    const runIds = new Set(c.running.map(x => x.id));
    errors.clear();
    c.running.concat(c.pending).forEach(x => infos.set(x.id, x));
    renderCurrent(run, pr, c, s);
    const rows = c.pending.map(x => `<tr><td>–</td><td>–</td><td class="ell" title="${esc(x.title || "")}">${jobLabel(x)}</td><td><span class="tag">queued</span></td><td>–</td><td>–</td><td></td></tr>`)
      .concat(c.history.filter(h => !runIds.has(h.id)).map(h => {
        const lvl = levelClass(h.status);
        if (h.error) errors.set(h.id, h.error);
        infos.set(h.id, h);
        const tag = h.error ? `<span class="tag ${lvl} btn" data-err="${esc(h.id)}" title="${lvl === "bad" ? "Show the error" : "Show what the review found"}">${esc(h.status)}</span>`
                            : `<span class="tag ${lvl}">${esc(h.status)}</span>`;
        return `<tr><td>${clock(h.start)}</td><td>${h.start && h.seconds != null ? clock(h.start + h.seconds) : "–"}</td><td class="ell" title="${esc(h.title || "")}">${jobLabel(h)}</td><td>${tag}</td><td class="num">${fmtDur(h.seconds)}</td>
          <td>${h.delivered ? `<span class="dlv ok" title="Delivered to Andorhal: ${esc(h.delivered.path)}">⇣</span>` : (((h.images || []).length + (h.models || []).length) && h.status === "success" ? `<span class="dlv" title="Not yet delivered to Andorhal">⇣</span>` : "")}${h.kind === "ai" ? "–" : `${h.outputs} files`}${viewBtn(h)}${(h.details?.prompts || []).length ? ` <button class="view" data-info="${esc(h.id)}" title="Show the prompt and settings">Prompt</button>` : ""}</td>
          <td><button class="ack" data-ack="${esc(h.id)}" title="Acknowledge: remove from this list (it stays in History)">✓</button></td></tr>`;
      }));
    $("ackAll").hidden = !c.history.length;
    // Högst fem rader här; äldre jobb finns i History
    const more = Math.max(0, rows.length - 5);
    $("queueInfo").textContent = (run || c.pending.length ? `${c.running.length} running · ${c.pending.length} queued` : "idle")
      + (more ? ` · ${more} older in History` : "");
    const html = rows.slice(0, 5).join("") || `<tr><td colspan="7" style="color:var(--muted)">No unacknowledged jobs · see History for older ones</td></tr>`;
    if (html !== lastRows) { $("history").innerHTML = html; lastRows = html; }
  } else if (s.comfy_error) {
    pill("comfyPill", "bad", `<span class="dot"></span><span class="ell" style="max-width:260px">ComfyUI not answering</span>`);
  }

  drawSparks(s.history || []);
}

function drawSparks(h) {
  const st = css(), last = h[h.length - 1] || {}, tEnd = last.t || 0;
  SERIES.forEach(([k]) => $("lg_" + k).textContent = last[k] == null ? "–" : last[k].toFixed(0) + " %");
  const cv = $("chart"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, ht = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(ht * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(ht * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, ht);
  const padL = 34, padB = 15, pw = w - padL, ph = ht - padB - 4;
  g.font = "10px system-ui, sans-serif"; g.fillStyle = st.getPropertyValue("--dim"); g.strokeStyle = st.getPropertyValue("--line"); g.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = Math.round(4 + ph - ph * v / 100) + .5;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(w, y); g.stroke();
    g.fillText(v + "%", 0, y + 3.5);
  });
  ["10 min ago", "5 min", "now"].forEach((l, i) => {
    const tw = g.measureText(l).width, x = padL + pw * i / 2 - tw / 2;
    g.fillText(l, Math.min(w - tw, Math.max(padL, x)), ht - 2);
  });
  const X = t => padL + pw * (1 - (tEnd - t) / 600), Y = v => 4 + ph - ph * Math.min(100, Math.max(0, v)) / 100;
  for (const [k, , col] of SERIES) {
    const raw = h.filter(pt => pt[k] != null && tEnd - pt.t <= 600);
    if (raw.length < 2) continue;
    // Mjukare kurva: glidande medel över fem mätpunkter och kvadratiska kurvor genom mittpunkterna
    const pts = raw.map((pt, i) => {
      const win = raw.slice(Math.max(0, i - 2), i + 3);
      return [X(pt.t), Y(win.reduce((a, q) => a + q[k], 0) / win.length)];
    });
    const color = st.getPropertyValue(col).trim();
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      g.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    }
    g.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    g.strokeStyle = color; g.lineWidth = 1.8; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
    g.lineTo(pts[pts.length - 1][0], Y(0)); g.lineTo(pts[0][0], Y(0)); g.closePath();
    const grad = g.createLinearGradient(0, 4, 0, 4 + ph);
    grad.addColorStop(0, color + "2a"); grad.addColorStop(1, color + "00");
    g.fillStyle = grad; g.fill();
  }
}

const placePop = (pop, r) => {
  const pw = pop.offsetWidth, ph = pop.offsetHeight, below = r.bottom + 6, above = r.top - ph - 6;
  pop.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.left)) + "px";
  pop.style.top = Math.max(8, Math.min(innerHeight - ph - 8, below + ph <= innerHeight - 8 ? below : above)) + "px";
};
// Felrutan: klick på ett "error"-märke visar hela meddelandet under märket
const errors = new Map(), infos = new Map();
function infoHtml(x) {
  const d = x.details || {}, p = d.params || {};
  return `<b>${esc(x.name)}${x.title ? `<span class="sub"> · ${esc(x.title.replace(/^[\w.-]+: /, ""))}</span>` : ""}</b>`
    + (d.prompts || []).map((t, i) => `<div class="dsub">Prompt${d.prompts.length > 1 ? " " + (i + 1) : ""} <button class="copy" data-copy="${i}">Copy</button></div><div class="ptext">${esc(t)}</div>`).join("")
    + (Object.keys(p).length ? `<div class="dsub">Settings</div>${Object.entries(p).map(([k, v]) => row(esc(k), esc(v))).join("")}` : "")
    + ((d.models || []).length ? `<div class="dsub">Models</div>${d.models.map(m => `<div class="ptext">${esc(m)}</div>`).join("")}` : "");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-err], [data-info]"), pop = $("pop");
  if (!t) { if (!e.target.closest("#pop") && !e.target.closest(".gauge[data-k]")) { pop.hidden = true; openDial = null; } return; }
  openDial = null;
  if (t.dataset.info) {
    const x = infos.get(t.dataset.info);
    if (!x) return;
    pop.className = "pop info wide"; pop.innerHTML = infoHtml(x);
  } else {
    const msg = errors.get(t.dataset.err);
    if (!msg) return;
    const st = infos.get(t.dataset.err)?.status;
    pop.className = "pop"; pop.innerHTML = `<b>${st === "warning" ? "Review warning" : st === "fail" ? "Review failed" : "Error"}</b>${esc(msg)}`;
  }
  pop.hidden = false;
  const r = t.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  placePop(pop, r);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button.copy");
  if (!b) return;
  const text = b.closest(".dsub").nextElementSibling.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch { const r = document.createRange(); r.selectNodeContents(b.closest(".dsub").nextElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
  b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500);
}, true);
addEventListener("keydown", e => { if (e.key === "Escape") $("pop").hidden = true; });
addEventListener("scroll", () => $("pop").hidden = true, { passive: true });

// Knapparna kräver två klick inom fyra sekunder, i stället för en dialogruta
let armed = null, armTimer = null;
document.querySelectorAll("button[data-action]").forEach(b => b.addEventListener("click", async () => {
  if (armed !== b) {
    if (armed) armed.classList.remove("armed");
    armed = b; b.classList.add("armed"); showMsg("Click again to confirm");
    clearTimeout(armTimer); armTimer = setTimeout(() => { b.classList.remove("armed"); armed = null; showMsg(""); }, 4000);
    return;
  }
  b.classList.remove("armed"); armed = null; clearTimeout(armTimer);
  showMsg("Working…");
  try { showMsg((await (await fetch("/api/action/" + b.dataset.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })).json()).message); }
  catch (e) { showMsg("Failed: " + e); }
  setTimeout(() => showMsg(""), 6000);
}));
function showMsg(t) { const el = $("msg"); el.textContent = t; el.classList.toggle("show", !!t); }

// Approve: en dialog med tjänst, steg och kostnad; först "Approve and run" skriver godkännandet
let pendingApprove = null;
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-approve]");
  if (!b) return;
  e.stopPropagation();
  pendingApprove = { id: b.dataset.approve, step: b.dataset.step, credits: parseInt(b.dataset.credits) };
  const row = (k, v) => `<span>${k}</span><span>${esc(v)}</span>`;
  $("approveKv").innerHTML = row("Order", b.dataset.order || b.dataset.approve) + row("Step", b.dataset.label || b.dataset.step)
    + row("Service", b.dataset.who || "Cloud") + row("Cost", `about ${b.dataset.credits} credits`);
  $("approveDlg").showModal();
}, true);
$("approveNo").onclick = () => { $("approveDlg").close(); pendingApprove = null; };
$("approveYes").onclick = async () => {
  const a = pendingApprove; $("approveDlg").close(); pendingApprove = null;
  if (!a) return;
  showMsg("Approving…");
  const r = await fetch(`/api/orders/${encodeURIComponent(a.id)}/approve`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ step: a.step, credits: a.credits }) });
  showMsg((await r.json()).message || "Done"); setTimeout(() => showMsg(""), 6000);
};
// Ett delsteg öppnas med ett klick: modellen i 3D-visaren, bilderna i bildvisaren
document.addEventListener("click", e => {
  const c = e.target.closest(".pchip.viewable");
  if (!c) return;
  if (c.dataset.vglb) window.open("/viewer?" + new URLSearchParams({ filename: c.dataset.vglb, subfolder: c.dataset.vsub, type: "output" }), "darrowmere-viewer", "width=1100,height=850");
  else window.open("/images?" + new URLSearchParams({ pl: c.dataset.vpl, step: c.dataset.vstep }), "darrowmere-images", "width=1200,height=900");
});
// View öppnar 3D-visaren i ett eget fönster
document.addEventListener("click", e => {
  const b = e.target.closest("button.view");
  if (!b || b.dataset.info) return;  // Prompt-knappen hanteras av rutan för promptar
  if (b.dataset.job) { window.open("/images?id=" + encodeURIComponent(b.dataset.job), "darrowmere-images", "width=1200,height=900"); return; }
  const q = new URLSearchParams({ filename: b.dataset.file, subfolder: b.dataset.sub, type: b.dataset.type });
  window.open("/viewer?" + q, "darrowmere-viewer", "width=1100,height=850");
});
// Kortet för pågående jobb: rad 1 namn och tid, rad 2 fas, en fyrkant per steg och takt/tid kvar
function renderCurrent(run, pr, c, s) {
  const set = (id, v, html) => { const el = $(id); if (el.dataset.v !== v) { el[html ? "innerHTML" : "textContent"] = v; el.dataset.v = v; } };
  // Pipelinen som det pågående jobbet hör till, annars en som pågår på en annan dator (t.ex. projicering på Andorhal)
  const pipes = s.pipelines || [];
  const pl = (run?.pipeline && pipes.find(p => p.id === run.pipeline.id))
    || pipes.find(p => p.active || p.steps.some(x => x.status === "running"));
  $("cur").classList.toggle("pipe", !!pl);
  $("curPipe").hidden = !pl;
  if (pl) {
    // Ett molnsteg som väntar på godkännande får en Approve-knapp med beräknad kostnad
    const ap = pl.steps.find(x => x.status === "approval");
    set("pipeName", ap ? `${esc(pl.title)} · waiting for approval`
                       : `${esc(pl.title)} · ${pl.done}/${pl.steps.length}`, true);
    $("pipeName").title = pl.title;
    set("pipeSteps", pl.steps.map(x => {
      const dur = x.start && x.end ? fmtDur(x.end - x.start) : x.start && x.status === "running" ? fmtDur(s.now - x.start) + " so far" : "";
      const tip = [x.label, x.status + (x.status === "running" && x.pct != null ? ` ${x.pct} %` : ""), x.where !== "darrowmere" ? "on " + x.where : "", dur, x.note || ""]
        .filter(Boolean).join(" · ");
      const cloud = x.route === "cloud" || x.kind === "review";
      const who = x.kind === "review" ? "DeepSeek" : x.provider ? x.provider[0].toUpperCase() + x.provider.slice(1) : "";
      const ctip = cloud ? ` · cloud${who ? ": " + who : ""}${x.credits ? ` · ${x.credits} credits` : x.estimate ? ` · ~${x.estimate} credits` : ""}` : "";
      // Ett delsteg med resultat går att öppna: modellen i 3D-visaren, annars bilderna i bildvisaren
      const files = x.files || [], glb = files.find(f => /\.(glb|gltf)$/i.test(f.filename)), img = files.some(f => /\.(png|jpe?g|webp)$/i.test(f.filename));
      const view = glb ? ` data-vglb="${esc(glb.filename)}" data-vsub="${esc(glb.subfolder || "")}"` : img ? ` data-vpl="${esc(pl.id)}" data-vstep="${esc(x.key)}"` : "";
      return `<span class="pchip ${esc(x.status)}${cloud ? " cloud" : ""}${view ? " viewable" : ""}"${view} title="${esc(tip + ctip + (view ? " · click to view" : ""))}">${cloud ? '<span class="ic">☁</span>' : ""}${esc(x.label)}${view ? '<span class="vw">⤢</span>' : ""}</span>`;
    }).join(""), true);
  }
  // Steg utan ComfyUI-jobb som pågår: en DeepSeek-granskning på Darrowmere, eller något på en annan dator
  const need = !run && pl && pl.steps.find(x => x.status === "approval");
  $("cur").classList.toggle("needs", !!need);
  if (need) {
    const who = need.provider ? need.provider[0].toUpperCase() + need.provider.slice(1) : "Cloud";
    $("cur").classList.add("on"); $("cur").classList.remove("cloudrun");
    set("curIcon", "⚠", true);
    set("curName", `Needs your approval<span class="sub"> · ☁ ${esc(who)} · ${esc(pl.title)}: ${esc(need.label)}</span>`, true);
    set("curTime", ""); set("curPhase", `~${need.estimate || "?"} ${who} credits`); set("curSteps", "", true);
    set("curTiming", `<button class="approve" data-approve="${esc(pl.id)}" data-step="${esc(need.key)}" data-credits="${need.estimate || 0}"
      data-who="${esc(who)}" data-label="${esc(need.label)}" data-order="${esc(pl.title)}" title="Review the cost and approve">Approve</button>`, true);
    return;
  }
  const local = !run && pl && pl.steps.find(x => x.status === "running" && (x.where !== "darrowmere" || x.kind === "review" || x.route === "cloud"));
  const cloudStep = local && (local.kind === "review" || local.route === "cloud");
  $("cur").classList.toggle("on", !!run || !!local);
  $("cur").classList.toggle("cloudrun", !!cloudStep);
  if (local) {
    const ai = local.kind === "review";
    const who = ai ? "DeepSeek" : local.provider ? local.provider[0].toUpperCase() + local.provider.slice(1) : "";
    set("curIcon", `<i class="spin big"></i>`, true);
    set("curName", cloudStep ? `<span class="cloudtag">☁ cloud</span>${esc(who)}<span class="sub"> · ${esc(pl.title)}: ${esc(local.label)}</span>`
                             : `${esc(pl.title)}<span class="sub"> · ${esc(local.label)}</span>`, true);
    set("curTime", local.start ? fmtDur(s.now - local.start) : "");
    set("curPhase", ai ? "Reviewing images" : cloudStep ? (local.pct != null ? `In the cloud · ${local.pct} %` : "In the cloud · waiting for the service") : `Running on ${local.where}`);
    // Molnsteg: en rad rutor för förloppet (tio rutor, en per tiondel), i molnfärg
    set("curSteps", cloudStep && local.pct != null ? Array.from({ length: 10 }, (_, i) => `<i style="background:${i < Math.floor(local.pct / 10) ? "var(--cloud)" : "var(--track)"}"></i>`).join("") : "", true);
    set("curTiming", ai ? "via OpenRouter" : cloudStep ? (local.estimate || local.credits ? `~${local.credits || local.estimate} credits` : "costs credits") : local.note || "");
    return;
  }
  if (!run) {
    set("curIcon", "", true);
    set("curName", c.pending.length ? `Waiting: ${c.pending.map(x => x.name).join(", ")}` : "Idle · nothing running");
    set("curTime", ""); set("curPhase", "ready"); set("curSteps", "", true); set("curTiming", "");
    return;
  }
  set("curIcon", `<i class="spin big"></i>`, true);
  set("curName", `${jobLabel(run)} <button class="view" data-info="${esc(run.id)}" title="Show the prompt and settings">Prompt</button>`, true);
  set("curTime", run.queued_at ? fmtDur(s.now - run.queued_at) : "");
  const total = pr?.total || 0, done = pr?.done || 0;
  set("curPhase", pr?.note ? pr.note[0].toUpperCase() + pr.note.slice(1) : total ? `Sampling · step ${done} of ${total}` : "Starting");
  // En ruta per nod i flödet (en per steg för provtagare): klara i sin färg, den pågående blinkar, resten grå
  let cells = "";
  if (pr?.plan) {
    const cell = (k, n, extra = "") => `<i class="k-${k}${extra}" title="${esc(n)}"></i>`;
    const parts = pr.cells.map(c => cell(c.k, c.n, c.c ? ` b-${c.c}` : ""));
    const cur = pr.cur;
    for (let i = 0; i < cur.w; i++) parts.push(i < cur.v ? cell(cur.k, cur.n) : i === cur.v ? cell(cur.k, cur.n, " now") : `<i title="${esc(cur.n)}"></i>`);
    while (parts.length < pr.plan) parts.push("<i></i>");
    cells = parts.join("");
  }
  set("curSteps", cells, true);
  const t = (pr?.timing || "").split(",");
  set("curTiming", total && done < total && t[0].includes("<") ? `${t[0].split("<")[1]} left · ${(t[1] || "").trim()}` : "");
}

// View: 3D-visaren för jobb med en modell, bildvisaren för jobb med bilder
function viewBtn(h) {
  const md = (h.models || [])[0];
  if (md) return ` <button class="view" data-file="${esc(md.filename)}" data-sub="${esc(md.subfolder)}" data-type="${esc(md.type)}" title="Open ${esc(md.filename)} in the 3D viewer">3D</button>`;
  if ((h.images || []).length) return ` <button class="view" data-job="${esc(h.id)}" title="Open the images">View</button>`;
  return "";
}

// När Darrowmere är avstängd eller flyttas: sidan står kvar med senaste värdena nedtonade och försöker igen,
// och fortsätter som vanligt så fort datorn svarar (ComfyUI och panelen startar av sig själva vid uppstart).
let lastStatus = null, lastOk = 0, failCount = 0;
async function tick() {
  try {
    const r = await fetch("/api/status", { cache: "no-store", signal: AbortSignal.timeout(6000) });
    if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search); return; }
    lastStatus = await r.json();
    if (failCount) document.body.classList.remove("offline");
    failCount = 0; lastOk = Date.now();
    render(lastStatus);
  } catch (e) {
    failCount++;
    // Ett eller två uteblivna svar (panelen startas om, nätet hackar) visas bara som en rad; först sedan blir sidan grå
    if (failCount < 3) { $("age").textContent = "waiting for the panel …"; return; }
    document.body.classList.add("offline");
    const since = lastOk ? new Date(lastOk).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "–";
    pill("netPill", "bad", `<span class="dot"></span><b>Darrowmere offline</b>`);
    pill("comfyPill", "bad", `<span class="dot"></span><span class="ell" style="max-width:260px">last seen ${since} · retrying</span>`);
    $("age").textContent = lastOk ? `no answer for ${fmtDur((Date.now() - lastOk) / 1000)}` : "";
  }
}
addEventListener("resize", () => lastStatus && drawSparks(lastStatus.history || []));
tick(); setInterval(tick, 3000);
</script>
