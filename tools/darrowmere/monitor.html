<!doctype html>
<html lang="en">
<head>
<script>/* Tema: menyvalet i panelen (darrowmere-theme: dark, light, system), mörkt om inget valts */(function(){var m;try{m=localStorage.getItem("darrowmere-theme")}catch(e){}if(m!=="light"&&m!=="system")m="dark";var t=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;var r=document.documentElement;r.dataset.theme=t;r.dataset.themeMode=m;if(t==="light")addEventListener("DOMContentLoaded",function(){var q=document.querySelector('meta[name="theme-color"]');if(q)q.content="#ffffff"})})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="/static/app-icon-180.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>Darrowmere Monitor</title>
<style>
  :root {
    --bg: #0f1215; --panel: #161a1f; --panel2: #1b2027; --line: #262c34; --text: #d7dce2; --muted: #7d8794; --dim: #4b5563;
    --green: #2bd46b; --teal: #1fb5b0; --blue: #4f8dff; --amber: #f2a93b; --red: #ef4f5f; --violet: #a77bff; --track: #232a32; --cloud: #7cc7ff; --cpu: #f472b6; --lime: #a3e635;
    --c-cpu: #a77bff; --c-ram: #d2bcff; --c-swap: #ebe0ff; --c-sys: #4f8dff; --c-data: #a3c3ff;
    --c-gpu1: #2bd46b; --c-vram1: #98ecb8; --c-gpu2: #f59e0b; --c-vram2: #fcd38a; --c-gpu3: #1fb5b0; --c-vram3: #8ee0dc;
  }
  :root[data-theme="light"] {
      --bg: #eef0f3; --panel: #ffffff; --panel2: #f6f7f9; --line: #dde1e6; --text: #1d2228; --muted: #687280; --dim: #a3abb5;
      --green: #16a34a; --teal: #0d9488; --blue: #2563eb; --amber: #d97706; --red: #dc2626; --violet: #7c3aed; --track: #e6e9ed; --cloud: #0284c7; --cpu: #db2777; --lime: #65a30d;
      --c-cpu: #7c3aed; --c-ram: #a78bfa; --c-swap: #ddd6fe; --c-sys: #2563eb; --c-data: #60a5fa;
      --c-gpu1: #16a34a; --c-vram1: #4ade80; --c-gpu2: #d97706; --c-vram2: #fbbf24; --c-gpu3: #0d9488; --c-vram3: #2dd4bf;
    }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 12.5px/1.35 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  header { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .brand { font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  /* Ordbilden (static/wordmark.png) som mask, så att den får textfärgen i både mörkt och ljust läge */
  .wordmark { display: block; flex: none; height: 32px; aspect-ratio: 605 / 120; background: var(--text);
    -webkit-mask: url(/static/wordmark.png) center / contain no-repeat; mask: url(/static/wordmark.png) center / contain no-repeat; }
  .pill { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, var(--line)); }
  .pill.run { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); }
  .pill.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.run .dot { animation: pulse 1.4s infinite; }
  /* Modellen som kör: bara namnet, stilla (det är ComfyUI-pillret som blinkar, och detaljerna finns i jobblistan) */
  .pill.model { color: var(--text); } .pill.model .dot { display: none; }
  .pill[hidden] { display: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }
  /* Menyn i sidhuvudet: Gallery, History, Log, Settings, konto och utloggning bakom en knapp */
  .menu { position: relative; flex: none; }
  #menuBtn { display: inline-flex; align-items: center; gap: 8px; }
  .burger, .burger::before, .burger::after { display: block; width: 13px; height: 1.5px; border-radius: 1px; background: currentColor; }
  .burger { position: relative; } .burger::before, .burger::after { content: ""; position: absolute; left: 0; }
  .burger::before { top: -4px; } .burger::after { top: 4px; }
  .menulist { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 170px; display: flex; flex-direction: column; gap: 2px; padding: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .menulist[hidden] { display: none; }
  .menulist button { border-color: transparent; background: none; text-align: left; justify-content: flex-start; width: 100%; }
  .menulist button:hover { background: var(--panel2); border-color: var(--line); }
  .menulist hr { border: 0; border-top: 1px solid var(--line); margin: 3px 2px; }
  #age { width: 104px; text-align: right; color: var(--muted); }

  main { padding: 12px 16px 20px; display: grid; gap: 10px; max-width: 1600px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .ph { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
  .ph .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .pb { padding: 10px 12px; }

  /* Mätare */
  .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .gauges.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gputag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .03em; padding: 0 5px; margin-right: 6px; border-radius: 4px;
            color: var(--muted); border: 1px solid var(--line); vertical-align: 1px; }
  .cur.second { margin-top: 6px; }
  /* Granskning och molnsteg: en tunn rad under grafikkorten, i stegets färg (moln blått, DeepSeek lila, annan dator teal).
     .cur.cur höjer specificiteten så att mobilregeln för .cur inte gör raden lika hög som korten. */
  .cur.cur.slim { height: auto; grid-template-rows: auto; padding: 6px 12px; margin: 4px 12px 2px; box-shadow: none; }
  /* Ett kort som inte kör något är en rad; det växer med fas, steg och delsteg först när något kör */
  .cur.cur.idle { height: auto; grid-template-rows: auto; padding: 6px 12px; }
  .cur.idle .cur2, .cur.idle .cur3 { display: none; }
  .cur.slim .cur2, .cur.slim .cur3, .cur.slim .legend2 { display: none; }
  .cur.slim .cur1 { font-size: 12px; font-weight: 600; color: var(--text); }
  .cur.slim .cur1 .sub { color: var(--muted); font-size: 12px; font-weight: 450; }
  .cur.slim .curtime { color: var(--acc); font-size: 12px; font-weight: 600; }
  /* Samma form för alla rader: tunn ram runt om, enheten och snurran i radens färg (--acc sätts per rad), bakgrunden svagt
     tonad när något kör */
  .cur { --acc: var(--muted); }
  .cur.on { background: color-mix(in srgb, var(--acc) 6%, var(--panel2)); }
  .cur .unit { display: inline-block; min-width: 96px; white-space: nowrap; color: var(--acc); font-weight: 700; font-size: 12.5px; letter-spacing: .02em; }
  .cur.idle .unit { color: var(--muted); }
  .cur .unit .uic { width: 15px; height: 15px; margin-right: 6px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 1.4;
                    stroke-linecap: round; stroke-linejoin: round; }
  .cur .snake { --snake: var(--acc); margin: 0 10px 0 0; }
  .cur .snake.off { visibility: hidden; }
  .curtime .est { color: var(--muted); font-weight: 450; }
  .cur.idle, .cur.idle #curName, .cur.idle [id^="curName_"] { color: var(--muted); font-weight: 500; }
  .cur.idle .legend2 { visibility: hidden; }
  .group .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* Ringvyn: en ratt per del med minnet eller den andra disken som inre ring, alla i en panel */
  .gauges.rings { grid-template-columns: minmax(0, 1fr); }
  .gauges.rings .pair { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .dial .core { transition: stroke-opacity .6s; }
  /* Texten innanför den inre ringen: lite mindre, så att den inte når ringen */
  /* Två ringars värden i samma cirkel: fyra korta rader (etikett, procent, yttre ringen, inre ringen) */
  .gauges.rings .dial .face { inset: 34px; grid-template-rows: 14px 27px 14px 14px; }
  .gauges.rings .dial .unit { display: none; }
  .gauges.rings .dial .lbl { font-size: 9.5px; letter-spacing: .12em; }
  .gauges.rings .dial .big { font-size: 23px; line-height: 27px; }
  .gauges.rings .dial .big small { font-size: 11px; }
  .gauges.rings .dial .m1 { font-size: 10.5px; max-width: 84px; }
  .gauges.rings .dial .m2 { font-size: 10px; max-width: 84px; color: var(--muted); }
  .menulist .chk { margin-left: auto; color: var(--blue); }
  .gauge { height: 176px; padding: 6px 6px 4px; display: grid; place-items: center; min-width: 0; }
  .dial { position: relative; width: 164px; height: 164px; max-width: 100%; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .dial .arc { transition: stroke-dasharray .6s cubic-bezier(.3, .7, .3, 1), stroke .4s; }
  /* Varningslampa som på en bils instrumentpanel: en liten gul triangel med utropstecken, bara konturen, när mätaren står på 100 % */
  .dial svg.full { position: absolute; inset: auto; bottom: 27px; left: -1px;  /* i nivå med ringens nedre ände (r 70, 45° under mitten) */ width: 18px; height: 17px; display: none; }
  .dial svg.full.on { display: block; }
  .dial .face { position: absolute; inset: 27px; border-radius: 50%; display: grid; grid-template-rows: 18px 34px 16px 15px 15px; align-content: center; justify-items: center;
                background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--panel2) 70%, transparent), transparent 70%); }
  .dial .lbl { color: var(--muted); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .dial .big { font-size: 29px; font-weight: 700; line-height: 34px; letter-spacing: -.02em; }
  .dial .big small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .dial .unit { color: var(--muted); font-size: 10px; }
  .dial .m1 { font-size: 11.5px; color: var(--text); max-width: 100px; }
  .dial .m2 { font-size: 11px; color: var(--muted); max-width: 92px; }  /* smalare: nedersta raden ligger där ringens ändar möts */

  /* Jobb */
  .ph .phinfo { margin-left: 10px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ph .actions { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; gap: 6px; }
  .ph .actions button { height: 24px; padding: 0 10px; font-size: 11.5px; }
  .rowprog { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; }
  .rowprog .prog { height: 6px; }
  .rowprog span { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
  /* Pågående jobb: ett kort med två rader ovanför listan, fast höjd */
  .cur { height: 62px; margin: 10px 12px 4px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--panel2); display: grid; grid-template-rows: 22px 20px; gap: 4px; }
  .cur.on { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
  .cur1, .cur2 { display: grid; align-items: center; gap: 12px; min-width: 0; }
  .cur1 { grid-template-columns: minmax(0, 1fr) auto auto; font-size: 14px; font-weight: 650; }
  .cur1 > [id^="curIcon"] { display: none; }
  .snake { display: inline-grid; grid-template-columns: repeat(3, 3px); grid-auto-rows: 3px; gap: 1px; margin: 0 2px 0 10px;
           vertical-align: 8px; color: var(--snake, var(--blue)); }  /* nederkanten på textens baslinje (rutnätets baslinje ligger efter första raden) */
  .snake b { background: currentColor; border-radius: .5px; opacity: .15; transition: opacity .1s linear; }
  .inl.warn { margin-left: 8px; color: var(--amber); }
  @media (max-width: 900px) { .legend2 { display: none; } }
  .cur2 { grid-template-columns: 170px minmax(0, 1fr) 150px; }
  .curtime { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .curphase, .curtiming { color: var(--muted); font-size: 11.5px; }
  .curtiming { text-align: right; }
  /* Pipeline: en tredje rad med alla delsteg när jobbet hör till en hel tillgång (3D, texturer, rigg …) */
  .cur.pipe { height: 90px; grid-template-rows: 22px 20px 20px; }
  .cur3 { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; min-width: 0; }
  .cur3[hidden], .cur[hidden] { display: none; }
  .pname { color: var(--muted); font-size: 11.5px; }
  .pchips { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
  .pchip { flex: 1 1 0; min-width: 0; height: 20px; line-height: 18px; border-radius: 4px; border: 1px solid var(--line); padding: 0 6px;
           font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--panel); }
  .pchip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 0;
                   background: var(--track); }
  .pchip.done { color: var(--text); } .pchip.done::before { background: var(--green); }
  .pchip.running { color: var(--text); border-color: var(--blue); }
  .pchip.running::before { background: var(--blue); animation: blink 1s steps(1, end) infinite; }
  .pchip.queued::before { background: none; box-shadow: inset 0 0 0 1.5px var(--amber); }
  .pchip.failed { border-color: var(--red); } .pchip.failed::before { background: var(--red); }
  .pchip.skipped { text-decoration: line-through; }
  .pchip.waiting::before { background: var(--amber); }
  .pchip.viewable { cursor: pointer; } .pchip.viewable:hover { border-color: var(--blue); color: var(--text); }
  .pchip .vw { margin-left: 4px; color: var(--muted); font-size: 10px; }
  .pchip.warning { border-color: color-mix(in srgb, var(--amber) 60%, var(--line)); } .pchip.warning::before { background: var(--amber); }
  .pchip.rejected { border-color: color-mix(in srgb, #fb923c 60%, var(--line)); } .pchip.rejected::before { background: #fb923c; }
  /* DeepSeek som etikett på raden den granskar */
  .dschip { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 0 7px; height: 18px; border-radius: 9px; font-size: 11px;
            font-weight: 600; white-space: nowrap; vertical-align: 1px; color: var(--violet); border: 1px solid color-mix(in srgb, var(--violet) 55%, var(--line));
            background: color-mix(in srgb, var(--violet) 12%, transparent); }
  .dschip svg { width: 12px; height: 12px; }
  .dschip.run { animation: dspulse 1.6s ease-in-out infinite; }
  @keyframes dspulse { 50% { background: color-mix(in srgb, var(--violet) 30%, transparent); } }
  .dschip.pass { color: var(--green); border-color: color-mix(in srgb, var(--green) 55%, var(--line)); background: color-mix(in srgb, var(--green) 12%, transparent); }
  .dschip.warning { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); background: color-mix(in srgb, var(--amber) 12%, transparent); }
  .dschip.fail, .dschip.rejected { color: var(--red); border-color: color-mix(in srgb, var(--red) 55%, var(--line)); background: color-mix(in srgb, var(--red) 12%, transparent); }
  /* Molnsteg (Meshy, Tripo, DeepSeek): streckad kant i molnfärg och ett moln före namnet; de kostar krediter */
  .pchip.cloud { border-style: dashed; border-color: color-mix(in srgb, var(--cloud) 55%, var(--line)); }
  .pchip.cloud.running { border-color: var(--cloud); border-style: dashed; }
  .pchip.cloud.running::before { background: var(--cloud); }
  .pchip .ic { color: var(--cloud); margin-right: 3px; }
  .pchip.approval { border-color: var(--amber); color: var(--text); } .pchip.approval::before { background: var(--amber); animation: blink 1s steps(1, end) infinite; }
  .cloudtag { display: inline-block; height: 16px; line-height: 15px; padding: 0 5px; margin-right: 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
              color: var(--cloud); border: 1px dashed color-mix(in srgb, var(--cloud) 60%, transparent); vertical-align: 1px; }
  .cur.cloudrun .legend2 { visibility: hidden; }
  .cur.needs { border-color: var(--amber); border-style: solid; }
  .cur.needs .legend2 { visibility: hidden; }
  /* Approve på kortet: liten, i radens höjd, gul kontur; fylld först när man håller över den. I dialogen är den större */
  button.approve { height: 20px; line-height: 18px; padding: 0 9px; font-size: 11px; font-weight: 600; border-radius: 5px;
                   background: transparent; border: 1px solid var(--amber); color: var(--amber); vertical-align: middle; }
  button.approve:hover { background: var(--amber); color: #1b1408; border-color: var(--amber); }
  dialog.ask button.approve { height: 30px; padding: 0 14px; font-size: 12.5px; background: var(--amber); color: #1b1408; }
  dialog.ask { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 18px 20px; width: min(420px, 92vw); }
  dialog.ask::backdrop { background: rgb(0 0 0 / .55); }
  dialog.ask h3 { margin: 0 0 10px; font-size: 15px; }
  dialog.ask .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12.5px; margin: 8px 0 14px; }
  dialog.ask .kv span:nth-child(odd) { color: var(--muted); }
  dialog.ask .btns { display: flex; justify-content: flex-end; gap: 8px; }  /* nodfärgerna gäller ComfyUI-jobb, inte molnsteg */
  .steps { display: flex; gap: 3px; height: 12px; overflow: hidden; align-items: center; }
  .steps i { flex: 0 1 12px; min-width: 3px; height: 12px; border-radius: 2px; background: var(--track); }
  /* Solida färger per slags steg; den pågående blinkar */
  .steps i.k-load { background: #f472b6; } .steps i.k-text { background: var(--violet); } .steps i.k-sample { background: var(--blue); }
  .steps i.k-vae { background: var(--amber); } .steps i.k-mesh { background: var(--teal); } .steps i.k-save { background: var(--green); }
  .steps i.k-other { background: #c8ced6; } .steps i.k-cached { background: var(--track); }
  /* Cachade steg: grå fyllning med en kant i stegets färg */
  .steps i.b-load { box-shadow: inset 0 0 0 1px #f472b6; } .steps i.b-text { box-shadow: inset 0 0 0 1px var(--violet); }
  .steps i.b-sample { box-shadow: inset 0 0 0 1px var(--blue); } .steps i.b-vae { box-shadow: inset 0 0 0 1px var(--amber); }
  .steps i.b-mesh { box-shadow: inset 0 0 0 1px var(--teal); } .steps i.b-save { box-shadow: inset 0 0 0 1px var(--green); }
  .steps i.b-other { box-shadow: inset 0 0 0 1px #c8ced6; }
  .steps i.now { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 50% { background: var(--track); } }
  .legend2 { display: flex; gap: 10px; color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; }
  .legend2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .nowname { font-size: 16px; font-weight: 650; }
  .nowprog { display: grid; grid-template-rows: 8px 16px; gap: 5px; min-width: 0; }
  .nowstage { color: var(--muted); font-size: 11.5px; }
  .nowtime { color: var(--muted); text-align: right; }
  .prog { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .prog > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--blue)); transition: width .5s; }
  .msgline { height: 0; color: var(--muted); padding: 0 12px; font-size: 11.5px; transition: height .2s; }
  .msgline.show { height: 22px; line-height: 22px; }
  .jobs .tablebox { height: auto; overflow: hidden; }  /* högst 5 rader, resten finns i History */
  .actions { display: flex; gap: 8px; align-items: center; }
  .tag.btn { cursor: pointer; }
  .tag.btn:hover { border-color: currentColor; }  /* klickbar: kanten tar statusens egen färg */
  .pop { position: fixed; z-index: 10; max-width: min(560px, calc(100vw - 16px)); max-height: min(260px, calc(100vh - 16px)); overflow: auto; padding: 10px 12px;
         background: var(--panel2); border: 1px solid color-mix(in srgb, var(--red) 45%, var(--line)); border-radius: 8px;
         box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .pop b { display: block; font-family: system-ui, sans-serif; font-size: 12px; color: var(--red); margin-bottom: 6px; }

  /* Diagrammet */

  .tag.ok { color: var(--green); } .tag.bad { color: var(--red); } .tag.run { color: var(--blue); }
  /* Larmnivåer: pass grön, warning gul (nära godkänd), fail orange (underkänd), error röd (tekniskt fel) */

  .ph button.ack { margin-left: 10px; text-transform: none; letter-spacing: 0; }
  pre { margin: 0; height: 262px; overflow: auto; padding: 8px 12px; font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); white-space: pre; }

  .ptext { white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text);
           background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; user-select: text; }
  .spin { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; border-radius: 50%;

  @media (max-width: 1100px) {

  /* Telefon: sidhuvudet på två rader, rattarna mindre två och två, jobbkortet staplat, listan bara med det viktigaste */

    header { height: auto; flex-wrap: wrap; row-gap: 6px; padding: 8px 12px; position: static; }

    #netPill2, #uptimePill { display: none; }

    .cur, .cur.pipe { height: auto; margin: 8px 8px 4px; padding: 8px 10px; grid-template-rows: auto; row-gap: 6px; }
    .cur1 { grid-template-columns: minmax(0, 1fr) auto; font-size: 13px; }
    .cur1 .legend2 { display: none; }
    .cur2 { grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; }

    /* Jobblistan som två rader per jobb: namn och titel över hela bredden, under den status, tid, resultat och ✓ */
    .jobs thead, .jobs colgroup { display: none; }
    .jobs table, .jobs tbody { display: block; }
    .jobs tr { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "job job job job" "st time out ack";
               align-items: center; column-gap: 8px; row-gap: 4px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
    .jobs td { border: 0; height: auto; padding: 0; }
    .jobs td:nth-child(1), .jobs td:nth-child(2) { display: none; }
    .jobs td:nth-child(3) { grid-area: job; font-size: 12.5px; }
    .jobs td:nth-child(4) { grid-area: st; }
    .jobs td:nth-child(5) { grid-area: time; color: var(--muted); font-size: 11.5px; }
    .jobs td:nth-child(6) { grid-area: out; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; color: var(--muted); }
    .jobs td:nth-child(7) { grid-area: ack; justify-self: end; }
    .jobs td[colspan] { display: block; grid-column: 1 / -1; }
    .chartwrap { height: 170px; padding: 6px 8px 4px; grid-template-rows: minmax(0, 1fr) auto; }
    .legend { flex-wrap: wrap; row-gap: 2px; gap: 8px; white-space: normal; }
    .pop.info, .pop.info.wide { width: calc(100vw - 16px); }
    dialog.ask { width: calc(100vw - 24px); }
  }
  @media (max-width: 560px) {
    main { padding: 8px 8px 16px; }
    header { overflow: visible; }
    .sparks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #uptimePill, #age { display: none; }
    .hwgrid { grid-template-columns: minmax(0, 1fr); }
    .hw { height: auto; }
  }
  /* Telefon, stående och liggande: sidhuvudet på en rad med menyn längst till höger (listan öppnas inåt), rattarna små utan
     detaljrader (tryck på en ratt för detaljerna) så att mer får plats på en skärm. Stående: fyra rattar i bredd. */
  @media (max-width: 560px), (max-height: 500px) and (orientation: landscape) {
    header { flex-wrap: nowrap; height: 42px; padding: 0 10px; gap: 6px; position: sticky; }
    header .spacer { flex: 1; flex-basis: auto; height: auto; }
    header .wordmark { height: 20px; }
    header .pill { font-size: 11.5px; }
    header button { height: 28px; padding: 0 9px; }
    .menulist { right: 0; left: auto; max-width: calc(100vw - 16px); max-height: calc(100vh - 60px); overflow: auto; }
    main { padding: 6px 6px 14px; gap: 6px; }
    .gauges, .gauges.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .gauges .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gauge { height: auto; padding: 4px 0 2px; }
    .gauge .dial { zoom: .5; }
    .dial .m1, .dial .m2, .dial .unit { display: none; }
    .dial .face, .gauges.rings .dial .face { grid-template-rows: 28px 50px; }
    .dial .lbl, .gauges.rings .dial .lbl { font-size: 20px; letter-spacing: .06em; }
    .dial .big, .gauges.rings .dial .big { font-size: 46px; line-height: 50px; }
    .dial .big small, .gauges.rings .dial .big small { font-size: 22px; }
    .dial svg.full { width: 30px; height: 28px; }
    .gauges.rings .pair { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cur, .cur.pipe { margin: 6px 6px 4px; }
    .cur.cur.idle { padding: 5px 10px; }
    .cur.cur.slim { padding: 5px 10px; margin: 4px 6px 2px; }
  }
  /* Telefon liggande (lågt men brett): alla rattar på en rad */
  @media (max-height: 500px) and (orientation: landscape) {
    .gauges, .gauges.two { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .gauges.rings .pair { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
    .chartwrap { height: 150px; }
  }
  /* Hemskärmsappen (iPhone): sidhuvudet under statusraden och allt innanför notchen i liggande läge */
  @supports (padding: env(safe-area-inset-top)) {
    header { height: auto; min-height: calc(46px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
             padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    main { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
           padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    @media (max-width: 560px), (max-height: 500px) and (orientation: landscape) {
      header { min-height: calc(42px + env(safe-area-inset-top)); padding-left: max(10px, env(safe-area-inset-left));
               padding-right: max(10px, env(safe-area-inset-right)); }
      main { padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right)); }
    }
  }

<body>
<header>
  <span class="wordmark" role="img" aria-label="Darrowmere" title="Darrowmere"></span>
  <span class="pill" id="netPill"><span class="dot"></span><b>connecting</b></span>
  <span class="pill" id="comfyPill" hidden><span class="dot"></span><span class="ell" style="max-width:260px">ComfyUI</span></span>
  <span class="pill" id="uptimePill">up <b id="uptime">–</b></span>
  <span class="pill num" id="netPill2" title="Network traffic"><span id="netRate" style="display:inline-block;width:150px">–</span></span>
  <span class="pill num" id="powerPill" title="System power">–</span>
  <span class="spacer"></span>
  <span class="num" id="age"></span>
  <div class="menu" id="menu">
    <button id="menuBtn" title="Menu" aria-haspopup="true" aria-expanded="false"><span class="burger"></span>Menu</button>
    <div class="menulist" id="menuList" role="menu" hidden>
      <button id="galBtn" role="menuitem" title="Everything Darrowmere has made: generations, renders, models and texture maps">Gallery</button>
      <button id="histBtn" role="menuitem" title="All jobs, also acknowledged ones">History</button>
      <button id="logBtn" role="menuitem" title="Open the ComfyUI log in its own window">Log</button>
      <button id="setBtn" role="menuitem" title="Display on this device, local or cloud generation, AI review, budget and API keys">Settings</button>
      <button id="reloadBtn" role="menuitem" title="Load the page again (the home-screen app has no reload button)">Reload</button>
      <hr>
      <button id="acctBtn" role="menuitem" title="Accounts and password"><span id="meName">Account</span></button>
      <button id="outBtn" role="menuitem" title="Log out">Log out</button>
    </div>
  </div>
</header>

<main>
  <section class="gauges" id="gauges"></section>

  <section class="panel jobs">
    <div class="ph">Jobs<span class="phinfo num" id="queueInfo"></span>
      <span class="actions">
        <button data-action="interrupt" title="Stop the running job">Stop</button>
        <button data-action="clear" title="Remove waiting jobs">Clear queue</button>
        <button data-action="restart" title="Restart the ComfyUI service">Restart</button>
        <button class="ack" id="ackAll" title="Acknowledge every finished job" hidden>✓ all</button>
      </span>
    </div>
    <div class="msgline ell" id="msg"></div>
    <div class="cur" id="cur">
      <div class="cur1"><span id="curIcon"></span><span class="ell" id="curName">Idle</span>
        <span class="legend2" title="Colour of each step"><span><i style="background:#f472b6"></i>load</span><span><i style="background:var(--violet)"></i>prompt</span><span><i style="background:var(--blue)"></i>sampling</span><span><i style="background:var(--amber)"></i>VAE</span><span><i style="background:var(--teal)"></i>3D</span><span><i style="background:var(--green)"></i>save</span><span><i style="background:var(--track);box-shadow:inset 0 0 0 1px var(--muted)"></i>cached</span></span>
        <span class="num curtime" id="curTime"></span></div>
      <div class="cur2"><span class="ell curphase num" id="curPhase"></span><span class="steps" id="curSteps"></span><span class="num curtiming ell" id="curTiming"></span></div>
      <div class="cur3" id="curPipe" hidden><span class="ell pname num" id="pipeName"></span><span class="pchips" id="pipeSteps"></span></div>
    </div>
    <div class="tablebox">
      <table>
        <colgroup><col style="width:64px"><col style="width:64px"><col><col style="width:96px"><col style="width:96px"><col style="width:200px"><col style="width:40px"></colgroup>
        <thead><tr><th>Started</th><th>Finished</th><th>Job</th><th>Status</th><th>Time</th><th>Output</th><th></th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>


  <section class="panel">
    <div class="ph">Last 10 minutes<span class="right">percent of capacity</span></div>
    <div class="chartwrap">
      <div class="cv"><canvas id="chart"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>
</main>
<div class="pop" id="pop" hidden></div>
<dialog class="ask" id="approveDlg">
  <h3>Approve a cloud step?</h3>
  <div class="kv" id="approveKv"></div>
  <div class="btns"><button id="approveNo">Not now</button><button class="approve" id="approveYes">Approve and run</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const css = () => getComputedStyle(document.documentElement);
const fmtB = b => b >= 1e12 ? (b / 1e12).toFixed(2) + " TB" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB";
const fmtRate = b => b >= 1e6 ? (b / 1e6).toFixed(1) + " MB/s" : (b / 1e3).toFixed(0) + " kB/s";
const fmtDur = s => s == null ? "–" : s < 60 ? s.toFixed(0) + " s" : s < 3600 ? Math.floor(s / 60) + " min " + String(Math.round(s % 60)).padStart(2, "0") + " s" : (s / 3600).toFixed(1) + " h";
const clock = t => t ? new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "–";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const level = p => p > 90 ? "--red" : p > 75 ? "--amber" : null;

// Rattarna byggs en gång och uppdateras sedan på plats, så att ingenting byter storlek.
// En båge på 270 grader med öppning nedåt; RAM har en inre tunn båge för växlingsutrymmet.
// Ett par rattar (last och minne) per grafikkort. Det första kortet heter gpu/vram, nästa gpu1/vram1 och så vidare.
const GPU_COLORS = [["--c-gpu1", "--c-vram1"], ["--c-gpu2", "--c-vram2"], ["--c-gpu3", "--c-vram3"], ["--red", "--cpu"]];
const gk = (base, i) => i ? base + i : base;
const R = 70, C = 2 * Math.PI * R, ARC = C * 0.75, R2 = 58, C2 = 2 * Math.PI * R2, ARC2 = C2 * 0.75;
let builtGpus = null, SERIES = [], INNER = {};
// Rattarnas stil: "pairs" (last och minne bredvid varandra) eller "rings" (minnet som inre ring, fem rattar med två kort)
let DIAL_STYLE = "pairs";
try { DIAL_STYLE = localStorage.getItem("darrowmere-dials") === "rings" ? "rings" : "pairs"; } catch (e) {}
function setDialStyle(v) {
  DIAL_STYLE = v; builtGpus = null;
  try { localStorage.setItem("darrowmere-dials", v); } catch (e) {}
  document.querySelectorAll("[data-dials] .chk").forEach(el => el.textContent = el.parentElement.dataset.dials === v ? "✓" : "");
  tick();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-dials]"); if (b) setDialStyle(b.dataset.dials); });
// Temat: mörkt, ljust eller som enheten; sparas per enhet (darrowmere-theme) och gäller alla panelens sidor
function themeChecks() { const m = document.documentElement.dataset.themeMode || "dark";
  document.querySelectorAll("[data-theme-set] .chk").forEach(el => el.textContent = el.parentElement.dataset.themeSet === m ? "✓" : ""); }
document.addEventListener("click", e => { const b = e.target.closest("[data-theme-set]"); if (!b) return;
  try { localStorage.setItem("darrowmere-theme", b.dataset.themeSet); } catch (err) {}
  location.reload(); });
themeChecks();
// Visningsvalen ställs in under Settings (eget fönster): ladda om när de ändras där
addEventListener("storage", e => { if (["darrowmere-theme", "darrowmere-dials", "darrowmere-rows"].includes(e.key)) location.reload(); });
// Raderna för grafikkort och tjänster: alltid synliga, eller bara de som kör något (allt stilla: en rad "All idle")
let ROWS_MODE = "all";
try { ROWS_MODE = localStorage.getItem("darrowmere-rows") === "active" ? "active" : "all"; } catch (e) {}
function setRowsMode(v) {
  ROWS_MODE = v;
  try { localStorage.setItem("darrowmere-rows", v); } catch (e) {}
  document.querySelectorAll("[data-rows] .chk").forEach(el => el.textContent = el.parentElement.dataset.rows === v ? "✓" : "");
  tick();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-rows]"); if (b) setRowsMode(b.dataset.rows); });
document.querySelectorAll("[data-rows] .chk").forEach(el => el.textContent = el.parentElement.dataset.rows === ROWS_MODE ? "✓" : "");
function applyRowsMode() {
  const cards = [...document.querySelectorAll(".cur:not(#allIdle)")].filter(el => !el.hidden);
  const idle = cards.filter(el => el.classList.contains("idle"));
  if (ROWS_MODE === "active") idle.forEach(el => el.hidden = true);
  let all = $("allIdle");
  if (!all) {
    all = document.createElement("div"); all.id = "allIdle"; all.className = "cur idle"; all.hidden = true;
    all.innerHTML = '<div class="cur1"><span class="ell"></span></div>';
    cards[cards.length - 1].after(all);
  }
  const none = ROWS_MODE === "active" && idle.length === cards.length;
  all.hidden = !none;
  if (none) {
    const v = `All idle · ${idle.map(el => el.querySelector(".unit")?.textContent).filter(Boolean).join(", ")}`;
    const el = all.querySelector(".ell"); if (el.textContent !== v) el.textContent = v;
    const last = [...document.querySelectorAll(".cur:not(#allIdle)")].pop(); if (last.nextElementSibling !== all) last.after(all);

function drawSparks(h) {
  const st = css(), last = h[h.length - 1] || {}, tEnd = last.t || 0;
  SERIES.forEach(([k]) => $("lg_" + k).textContent = last[k] == null ? "–" : last[k].toFixed(0) + " %");
  const cv = $("chart"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, ht = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(ht * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(ht * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, ht);
  const padL = 34, padB = 15, pw = w - padL, ph = ht - padB - 4;
  g.font = "10px system-ui, sans-serif"; g.fillStyle = st.getPropertyValue("--dim"); g.strokeStyle = st.getPropertyValue("--line"); g.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = Math.round(4 + ph - ph * v / 100) + .5;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(w, y); g.stroke();
    g.fillText(v + "%", 0, y + 3.5);
  });
  ["10 min ago", "5 min", "now"].forEach((l, i) => {
    const tw = g.measureText(l).width, x = padL + pw * i / 2 - tw / 2;
    g.fillText(l, Math.min(w - tw, Math.max(padL, x)), ht - 2);
  });
  const X = t => padL + pw * (1 - (tEnd - t) / 600), Y = v => 4 + ph - ph * Math.min(100, Math.max(0, v)) / 100;
  for (const [k, , col] of SERIES) {
    const raw = h.filter(pt => pt[k] != null && tEnd - pt.t <= 600);
    if (raw.length < 2) continue;
    // Mjukare kurva: glidande medel över fem mätpunkter och kvadratiska kurvor genom mittpunkterna
    const pts = raw.map((pt, i) => {
      const win = raw.slice(Math.max(0, i - 2), i + 3);
      return [X(pt.t), Y(win.reduce((a, q) => a + q[k], 0) / win.length)];
    });
    const color = st.getPropertyValue(col).trim();
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      g.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    }
    g.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    g.strokeStyle = color; g.lineWidth = 1.8; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
    g.lineTo(pts[pts.length - 1][0], Y(0)); g.lineTo(pts[0][0], Y(0)); g.closePath();
    const grad = g.createLinearGradient(0, 4, 0, 4 + ph);
    grad.addColorStop(0, color + "2a"); grad.addColorStop(1, color + "00");
    g.fillStyle = grad; g.fill();
  }
}

// Kortet för pågående jobb: rad 1 namn och tid, rad 2 fas, en fyrkant per steg och takt/tid kvar
// Kort: ett per grafikkort (lane satt) som bara visar vad kortet gör, och med flera kort ett "övrigt"-kort (other) för
// granskningar, molnsteg och godkännanden, som inte körs på något av korten. Övrigt-kortet syns bara när något pågår.

     + '<path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6h2.5M1.5 10h2.5M12 6h2.5M12 10h2.5"/>',
  cloud: '<path d="M4.6 12.5h7.2a2.9 2.9 0 0 0 .4-5.77A3.9 3.9 0 0 0 4.7 6.1 3.2 3.2 0 0 0 4.6 12.5z"/>',
  host: '<rect x="1.8" y="2.5" width="12.4" height="8.5" rx="1.2"/><path d="M5.5 14h5M8 11v3"/>',
};
const unitTag = (name, kind = "gpu") => `<span class="unit"><svg class="uic" viewBox="0 0 16 16" aria-hidden="true">${UNIT_ICONS[kind]}</svg>${esc(name)}</span>`;
const fmtShort = s => s < 60 ? Math.round(s) + " s" : s < 3600 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
const median = a => { const v = a.filter(x => x > 0).sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : null; };

  const m = last.note.match(/^(\w+)\s+(\d+(?:\.\d+)?)\/10/);

function renderCurrent(run, pr, c, s, sfx = "", lane = null, other = false, ds = false) {  // sfx: "_1" … för korten efter det första

  }
  const set = (id, v, html) => { const el = $(id + sfx); if (el.dataset.v !== v) { el[html ? "innerHTML" : "textContent"] = v; el.dataset.v = v; } };
  // Pipelinen som det pågående jobbet hör till, annars en som pågår på en annan dator (t.ex. projicering på Andorhal)
  const pipes = s.pipelines || [];
  // Steg som körs utanför grafikkorten: DeepSeeks granskningar på sin rad, moln och andra datorer på sin
  const offGpu = x => x.status === "running" && (ds ? x.kind === "review"
    : other ? x.kind !== "review" && (x.where !== "darrowmere" || x.route === "cloud")
    : x.where !== "darrowmere" || x.kind === "review" || x.route === "cloud");
  const pl = (run?.pipeline && pipes.find(p => p.id === run.pipeline.id))
    || (ds ? pipes.find(p => p.steps.some(offGpu)) : other ? pipes.find(p => p.steps.some(offGpu) || p.steps.some(x => x.status === "approval"))
           : pipes.find(p => p.active || p.steps.some(x => x.status === "running")));
  $("cur" + sfx).classList.toggle("pipe", !!pl);
  $("curPipe" + sfx).hidden = !pl;
  if (pl) {
    // Ett molnsteg som väntar på godkännande får en Approve-knapp med beräknad kostnad
    const ap = pl.steps.find(x => x.status === "approval");
    set("pipeName", ap ? `${esc(pl.title)} · waiting for approval`
                       : `${esc(pl.title)} · ${pl.done}/${pl.steps.length}`, true);
    $("pipeName" + sfx).title = pl.title;
    set("pipeSteps", pl.steps.map(x => {
      const dur = x.start && x.end ? fmtDur(x.end - x.start) : x.start && x.status === "running" ? fmtDur(s.now - x.start) + " so far" : "";
      const tip = [x.label, x.status + (x.status === "running" && x.pct != null ? ` ${x.pct} %` : ""), x.where !== "darrowmere" ? "on " + x.where : "", dur, x.note || ""]
        .filter(Boolean).join(" · ");
      const cloud = x.route === "cloud" || x.kind === "review";
      const who = x.kind === "review" ? "DeepSeek" : x.provider ? x.provider[0].toUpperCase() + x.provider.slice(1) : "";
      const ctip = cloud ? ` · cloud${who ? ": " + who : ""}${x.credits ? ` · ${x.credits} credits` : x.estimate ? ` · ~${x.estimate} credits` : ""}` : "";
      // Ett delsteg med resultat går att öppna: modellen i 3D-visaren, annars bilderna i bildvisaren
      const files = x.files || [], glb = finalGlb(files.filter(f => /\.(glb|gltf)$/i.test(f.filename))), img = files.some(f => /\.(png|jpe?g|webp)$/i.test(f.filename));
      const view = glb ? ` data-vglb="${esc(glb.filename)}" data-vsub="${esc(glb.subfolder || "")}"` : img ? ` data-vpl="${esc(pl.id)}" data-vstep="${esc(x.key)}"` : "";
      return `<span class="pchip ${esc(x.status)}${cloud ? " cloud" : ""}${view ? " viewable" : ""}"${view} title="${esc(tip + ctip + (view ? " · click to view" : ""))}">${cloud ? '<span class="ic">☁</span>' : ""}${esc(x.label)}${view ? '<span class="vw">⤢</span>' : ""}</span>`;
    }).join(""), true);
  }
  // Steg utan ComfyUI-jobb som pågår: en DeepSeek-granskning på Darrowmere, eller något på en annan dator
  const need = !run && !ds && pl && pl.steps.find(x => x.status === "approval");
  $("cur" + sfx).classList.toggle("needs", !!need);
  $("cur" + sfx).classList.remove("slim");
  if (need) {
    const who = need.provider ? need.provider[0].toUpperCase() + need.provider.slice(1) : "Cloud";
    $("cur" + sfx).classList.add("on"); $("cur" + sfx).classList.remove("cloudrun");
    $("cur" + sfx).style.setProperty("--acc", "var(--amber)");
    set("curIcon", "", true);
    set("curName", `${unitTag(who, "cloud")}${SNAKE_OFF}Needs your approval<span class="inl warn">⚠</span><span class="sub"> · ${esc(pl.title)}: ${esc(need.label)}</span>`, true);
    set("curTime", ""); set("curPhase", `~${need.estimate || "?"} ${who} credits`); set("curSteps", "", true);
    set("curTiming", `<button class="approve" data-approve="${esc(pl.id)}" data-step="${esc(need.key)}" data-credits="${need.estimate || 0}"
      data-who="${esc(who)}" data-label="${esc(need.label)}" data-order="${esc(pl.title)}" title="Review the cost and approve">Approve</button>`, true);
    return;
  }
  const local = !run && pl && pl.steps.find(offGpu);
  const cloudStep = local && (local.kind === "review" || local.route === "cloud" || local.where === "runpod");
  $("cur" + sfx).classList.toggle("on", !!run || !!local);
  $("cur" + sfx).classList.toggle("cloudrun", !!cloudStep);
  $("cur" + sfx).classList.toggle("ai", !!(local && local.kind === "review"));
  if (local) {
    const ai = local.kind === "review";
    const where = local.where ? local.where[0].toUpperCase() + local.where.slice(1) : "";
    const who = ai ? "DeepSeek" : local.provider ? local.provider[0].toUpperCase() + local.provider.slice(1) : local.where === "runpod" ? "RunPod" : where;
    $("cur" + sfx).style.setProperty("--acc", ai ? "var(--violet)" : cloudStep ? "var(--cloud)" : "var(--teal)");
    set("curIcon", "", true);
    set("curName", `${unitTag(who, cloudStep ? "cloud" : "host")}${SNAKE}${esc(pl.title)}<span class="sub"> · ${esc(local.label)}${other && local.pct != null ? ` · ${local.pct} %` : ""}${other && local.note ? ` · ${esc(local.note)}` : ""}</span>`, true);
    // Beräknad total: stegets egen prognos (eta, sekunder kvar), annars medianen av tidigare DeepSeek-granskningar
    const el = local.start ? s.now - local.start : null;
    const est = local.eta != null && el != null ? el + local.eta : ai ? median((c.history || []).filter(isDs).slice(0, 10).map(h => h.seconds)) : null;
    set("curTime", timeCell(el, est), true);
    if (other) { $("cur" + sfx).classList.add("slim"); return; }  // granskning och moln: en tunn rad, inget mer
    set("curPhase", ai ? "Reviewing images" : cloudStep ? (local.pct != null ? `In the cloud · ${local.pct} %` : "In the cloud · waiting for the service") : `Running on ${local.where}`);
    // Molnsteg: en rad rutor för förloppet (tio rutor, en per tiondel), i molnfärg
    set("curSteps", cloudStep && local.pct != null ? Array.from({ length: 10 }, (_, i) => `<i style="background:${i < Math.floor(local.pct / 10) ? "var(--cloud)" : "var(--track)"}"></i>`).join("") : "", true);
    set("curTiming", ai ? "via OpenRouter" : cloudStep ? (local.estimate || local.credits ? `~${local.credits || local.estimate} credits` : "costs credits") : local.note || "");
    return;
  }
  if (!run && ds) {  // DeepSeek granskar inget just nu: en grå rad som de lediga grafikkorten
    $("cur" + sfx).classList.add("idle"); $("cur" + sfx).classList.remove("on", "pipe", "cloudrun", "ai");
    set("curIcon", "", true); set("curName", `${unitTag("DeepSeek", "cloud")}${SNAKE_OFF}Idle`, true); set("curTime", "");
    return;
  }
  if (!run) {
    if (other) { $("cur" + sfx).hidden = true; return; }  // inget i molnet eller på andra datorer just nu
    set("curIcon", "", true);
    set("curName", `${unitTag(lane || "GPU", "gpu")}${SNAKE_OFF}${c.pending.length ? `Waiting: ${esc(c.pending.map(x => x.name).join(", "))}` : "Idle · nothing running"}`, true);
    set("curTime", ""); set("curPhase", "ready"); set("curSteps", "", true); set("curTiming", "");
    return;
  }
  set("curIcon", "", true);
  // Kortet, snurran, sedan modellen och jobbets titel: texten börjar alltid vid samma vänsterkant
  set("curName", `${unitTag(lane || "GPU", "gpu")}${SNAKE}${esc(run.name)}${run.title ? `<span class="sub"> · ${esc(run.title.replace(/^[\w.-]+: /, ""))}</span>` : ""}${dsChip(pl)} <button class="view" data-info="${esc(run.id)}" title="Show the prompt and settings">Prompt</button>`, true);
  set("curTime", run.queued_at ? timeCell(s.now - run.queued_at, jobEstimate(c, run, lane)) : "", true);
  const total = pr?.total || 0, done = pr?.done || 0;
  set("curPhase", pr?.note ? pr.note[0].toUpperCase() + pr.note.slice(1) : total ? `Sampling · step ${done} of ${total}` : "Starting");
  // En ruta per nod i flödet (en per steg för provtagare): klara i sin färg, den pågående blinkar, resten grå
  let cells = "";
  if (pr?.plan) {
    const cell = (k, n, extra = "") => `<i class="k-${k}${extra}" title="${esc(n)}"></i>`;
    const parts = pr.cells.map(c => cell(c.k, c.n, c.c ? ` b-${c.c}` : ""));
    const cur = pr.cur;
    for (let i = 0; i < cur.w; i++) parts.push(i < cur.v ? cell(cur.k, cur.n) : i === cur.v ? cell(cur.k, cur.n, " now") : `<i title="${esc(cur.n)}"></i>`);
    while (parts.length < pr.plan) parts.push("<i></i>");
    cells = parts.join("");
  }
  set("curSteps", cells, true);
  const t = (pr?.timing || "").split(",");
  set("curTiming", total && done < total && t[0].includes("<") ? `${t[0].split("<")[1]} left · ${(t[1] || "").trim()}` : "");
}

// View: 3D-visaren för jobb med en modell, bildvisaren för jobb med bilder
// Den färdiga modellen: flöden sparar ofta en grov förhandsform först (Pixal3D/TRELLIS: _00001_ är 32³-voxlar),
// så välj filen med högst löpnummer och vid lika den sista i listan
function finalGlb(list) {
  const n = f => +((f.filename.match(/_(\d+)_?\.(glb|gltf)$/i) || [])[1] || 0);
  return list.reduce((best, f) => !best || n(f) >= n(best) ? f : best, null);
}
function viewBtn(h) {
  const md = finalGlb(h.models || []);
  if (md) return ` <button class="view" data-file="${esc(md.filename)}" data-sub="${esc(md.subfolder)}" data-type="${esc(md.type)}" title="Open ${esc(md.filename)} in the 3D viewer">3D</button>`;
  if ((h.images || []).length) return ` <button class="view" data-job="${esc(h.id)}" title="Open the images">View</button>`;
  return "";
}

// När Darrowmere är avstängd eller flyttas: sidan står kvar med senaste värdena nedtonade och försöker igen,
// och fortsätter som vanligt så fort datorn svarar (ComfyUI och panelen startar av sig själva vid uppstart).
let lastStatus = null, lastOk = 0, failCount = 0, UI_VER = null;
$("reloadBtn").onclick = () => location.reload();
// En hämtning åt gången: på en långsam dator eller förbindelse hinner en hämtning inte klart på tre sekunder,
// och då ska nästa vänta i stället för att läggas ovanpå
let ticking = false;
async function tick() {
  if (ticking) return;
  ticking = true;
  try {
    const r = await fetch("/api/status", { cache: "no-store", signal: AbortSignal.timeout(6000) });
    if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search); return; }
    lastStatus = await r.json();
    // En ny version av panelen har driftsatts: ladda om (hemskärmsappen har ingen knapp för det)
    if (lastStatus.ui && UI_VER && lastStatus.ui !== UI_VER) { location.reload(); return; }
    UI_VER = UI_VER || lastStatus.ui;
    if (failCount) document.body.classList.remove("offline");
    failCount = 0; lastOk = Date.now();
    render(lastStatus);
  } catch (e) {
    failCount++;
    // Ett eller två uteblivna svar (panelen startas om, nätet hackar) visas bara som en rad; först sedan blir sidan grå
    if (failCount < 3) { $("age").textContent = "waiting for the panel …"; return; }
    document.body.classList.add("offline");
    const since = lastOk ? new Date(lastOk).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "–";
    pill("netPill", "bad", `<span class="dot"></span><b>Darrowmere offline</b>`);
    pill("comfyPill", "bad", `<span class="dot"></span><span class="ell" style="max-width:260px">last seen ${since} · retrying</span>`);
    $("age").textContent = lastOk ? `no answer for ${fmtDur((Date.now() - lastOk) / 1000)}` : "";
  } finally { ticking = false; }
}
addEventListener("resize", () => lastStatus && drawSparks(lastStatus.history || []));
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });   // direkt när fliken syns igen
tick(); setInterval(tick, 3000);
</script>
</body>
