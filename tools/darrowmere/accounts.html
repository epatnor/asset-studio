<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darrowmere Accounts</title>
<style>
  :root { --bg: #0f1215; --panel: #161a1f; --panel2: #1b2027; --line: #262c34; --text: #d7dce2; --muted: #7d8794; --blue: #4f8dff; --red: #ef4f5f; --green: #2bd46b; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef0f3; --panel: #ffffff; --panel2: #f6f7f9; --line: #dde1e6; --text: #1d2228; --muted: #687280; --blue: #2563eb; --red: #dc2626; --green: #16a34a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  h1 { font-size: 13px; letter-spacing: .14em; margin: 4px 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
  h2 { margin: 0; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  td { height: 32px; border-bottom: 1px solid var(--line); padding: 0 6px; }
  td:last-child { text-align: right; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input { font: inherit; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); flex: 1 1 140px; min-width: 0; }
  button { font: inherit; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--blue); }
  button.del:hover { border-color: var(--red); color: var(--red); }
  .msg { min-height: 1.2em; font-size: 12px; color: var(--muted); }
  .msg.bad { color: var(--red); } .msg.ok { color: var(--green); }
  .me { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ACCOUNTS</h1>
  <section>
    <h2>Accounts</h2>
    <table><tbody id="list"></tbody></table>
    <div class="row"><input id="nu" placeholder="New account name" autocomplete="off"><input id="np" type="password" placeholder="Password (8+ characters)" autocomplete="new-password"><button id="add">Add</button></div>
    <div class="msg" id="m1"></div>
  </section>
  <section>
    <h2>Change your password</h2>
    <div class="row"><input id="old" type="password" placeholder="Current password" autocomplete="current-password"><input id="new" type="password" placeholder="New password" autocomplete="new-password"><button id="chg">Change</button></div>
    <div class="msg" id="m2"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = async (url, body) => (await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
const say = (id, d) => { $(id).textContent = d.message || (d.ok ? "Done." : "Failed."); $(id).className = "msg " + (d.ok ? "ok" : "bad"); };
let me = "";
async function load() {
  const r = await fetch("/api/accounts");
  if (r.status === 401) { location.href = "/login?next=/accounts"; return; }
  const d = await r.json(); me = d.me;
  $("list").innerHTML = d.users.map(u => `<tr><td>${esc(u.name)}${u.name === me ? ' <span class="me">· you</span>' : ""}</td>
    <td class="me">${u.created ? new Date(u.created * 1000).toLocaleDateString() : ""}</td>
    <td>${u.name === me ? "" : `<button class="del" data-u="${esc(u.name)}">Remove</button>`}</td></tr>`).join("");
}
$("list").onclick = async e => {
  const b = e.target.closest("button[data-u]");
  if (!b) return;
  if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Click to confirm"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "Remove"; }, 4000); return; }
  say("m1", await post("/api/accounts/delete", { username: b.dataset.u })); load();
};
$("add").onclick = async () => { const d = await post("/api/accounts/add", { username: $("nu").value.trim(), password: $("np").value }); say("m1", d); if (d.ok) { $("nu").value = $("np").value = ""; load(); } };
$("chg").onclick = async () => { const d = await post("/api/accounts/password", { old: $("old").value, new: $("new").value }); say("m2", d); if (d.ok) $("old").value = $("new").value = ""; };
load();
</script>
</body>
</html>
