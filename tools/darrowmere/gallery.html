<!doctype html>
<html lang="en">
<head>
<script>/* Tema: menyvalet i panelen (darrowmere-theme: dark, light, system), mörkt om inget valts */(function(){var m;try{m=localStorage.getItem("darrowmere-theme")}catch(e){}if(m!=="light"&&m!=="system")m="dark";var t=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;var r=document.documentElement;r.dataset.theme=t;r.dataset.themeMode=m;if(t==="light")addEventListener("DOMContentLoaded",function(){var q=document.querySelector('meta[name="theme-color"]');if(q)q.content="#ffffff"})})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darrowmere Gallery</title>
<style>
  :root { --bg: #0f1215; --panel: #161a1f; --panel2: #1b2027; --line: #262c34; --text: #d7dce2; --muted: #7d8794; --blue: #4f8dff;
          --green: #34d399; --amber: #fbbf24; --violet: #a78bfa; --cyan: #22d3ee; --pink: #f472b6; }
  :root[data-theme="light"] { --bg: #eef0f3; --panel: #ffffff; --panel2: #f6f7f9; --line: #dde1e6; --text: #1d2228; --muted: #687280; --blue: #2563eb;
            --green: #059669; --amber: #b45309; --violet: #7c3aed; --cyan: #0891b2; --pink: #db2777; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 12.5px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  .wordmark { display: block; flex: none; height: 28px; aspect-ratio: 605 / 120; background: var(--text);
    -webkit-mask: url(/static/wordmark.png) center / contain no-repeat; mask: url(/static/wordmark.png) center / contain no-repeat; }
  header b { letter-spacing: .12em; font-size: 13px; margin-right: 6px; }
  input, select, button { font: inherit; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  input { padding: 0 10px; width: 220px; } select { padding: 0 6px; } button { padding: 0 10px; cursor: pointer; white-space: nowrap; }
  input:focus, select:focus { outline: none; border-color: var(--blue); }
  button:hover { border-color: var(--blue); }
  .chip { color: var(--muted); } .chip.on { color: var(--text); border-color: color-mix(in srgb, var(--k) 70%, var(--line)); background: color-mix(in srgb, var(--k) 14%, var(--panel2)); }
  .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--k); margin-right: 6px; vertical-align: 0; }
  .chip small { color: var(--muted); margin-left: 4px; }
  #info { color: var(--muted); margin-left: auto; white-space: nowrap; }
  main { padding: 12px 16px 40px; display: grid; gap: 14px; max-width: 1800px; margin: 0 auto; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; }
  .gh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
  .gh h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .gh .meta { color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.cloud { border-style: dashed; color: var(--cyan); }
  /* Uppdrag: flera beställningar med ett syfte, sorterade efter granskningens betyg */
  details.mission { background: color-mix(in srgb, var(--blue) 5%, var(--bg)); border: 1px solid color-mix(in srgb, var(--blue) 35%, var(--line));
                    border-radius: 12px; padding: 8px 10px 10px; }
  details.mission > summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 2px 2px 8px; list-style: none; }
  details.mission > summary::-webkit-details-marker { display: none; }
  details.mission > summary::before { content: "▸"; color: var(--muted); }
  details.mission[open] > summary::before { content: "▾"; }
  details.mission > summary h2 { margin: 0; font-size: 15px; font-weight: 700; }
  details.mission .mgroups { display: grid; gap: 10px; }
  .tag.score { font-weight: 600; color: var(--text); }
  .tag.score.pass { border-color: var(--green, #3fb950); } .tag.score.warning { border-color: var(--amber, #d29922); }
  .tag.score.fail, .tag.score.rejected { border-color: var(--red, #f85149); }
  .rank { font-weight: 700; color: var(--muted); }
  details.mission .rgrid { margin-top: 2px; }
  .why { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; margin: -4px 0 8px; }
  .step { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; margin: 4px 0 -2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .step b { color: var(--text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { position: relative; display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--panel2);
          cursor: pointer; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--blue); }
  .thumb { aspect-ratio: 1; display: grid; place-items: center; background:
           repeating-conic-gradient(color-mix(in srgb, var(--line) 55%, transparent) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .ph { font-size: 26px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .cap { padding: 5px 7px 0; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .when { padding: 1px 7px 6px; }
  .when { font-size: 11px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .85; }
  .badge { position: absolute; top: 6px; left: 6px; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px;
           background: color-mix(in srgb, var(--k) 85%, black); color: #fff; }
  .k-model { --k: var(--violet); } .k-image { --k: var(--blue); } .k-render { --k: var(--green); } .k-inspect { --k: var(--amber); } .k-map { --k: var(--pink); }
  #msg { color: var(--muted); padding: 30px; text-align: center; }
  /* Lägen: Results (det färdiga, en ruta per beställning) och All files (alla filer per steg) */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--blue); color: #fff; }
  body.results #chips { display: none; }
  .rsec { display: grid; gap: 8px; }
  .rsec > h3 { margin: 2px 2px 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .rcard { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); min-width: 0; }
  .rcard:hover { border-color: color-mix(in srgb, var(--blue) 60%, var(--line)); }
  .rcard .thumb { aspect-ratio: 4 / 3; position: relative; cursor: pointer; }
  .rcard .thumb img { position: absolute; inset: 0; }   /* bilden får inte bestämma kortets bredd */
  .rcard .thumb .ph { position: absolute; }
  .rcard .badge { top: 8px; left: 8px; }
  .rbody { padding: 8px 10px 9px; display: grid; gap: 4px; min-width: 0; }
  .rbody b { font-size: 12.5px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rbody .sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rtags { display: flex; flex-wrap: wrap; gap: 4px; }
  .racts { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .racts button { height: 24px; font-size: 11.5px; padding: 0 8px; }
  .racts label { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); font-size: 11.5px; cursor: pointer; margin-left: auto; }
  .rcard.sel { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet); }
  .srcs { display: flex; gap: 4px; overflow-x: auto; }
  .srcs img { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; flex: none; background: var(--panel2); }
  .srcs img:hover { border-color: var(--blue); }
  .pick { position: absolute; top: 6px; right: 6px; z-index: 1; display: inline-flex; gap: 5px; align-items: center; padding: 3px 8px;
          border-radius: 6px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line);
          font-size: 11.5px; cursor: pointer; color: var(--text); }
  .pick:hover { border-color: var(--violet); }
  .pick input { width: auto; height: auto; padding: 0; margin: 0; }   /* inte sökfältets bredd (input-regeln ovan) */
  .rcard.sel .pick { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 30%, var(--panel)); }
  #cmpHead[disabled] { opacity: .55; cursor: default; }
  body:not(.results) #cmpHead, body:not(.results) #cmpReset { display: none; }
  #cmpBar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; display: none; gap: 8px; align-items: center;
            padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--violet); box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
  #cmpBar.on { display: flex; }
  #cmpBar span { color: var(--muted); white-space: nowrap; }
  #cmpGo { border-color: var(--violet); color: var(--text); }
  /* Bildvisaren */
  #lb { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 94%, transparent); display: none; grid-template-rows: auto minmax(0, 1fr); }
  #lb.open { display: grid; }
  #lb .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  #lb .bar span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #lb .bar a { color: var(--blue); text-decoration: none; white-space: nowrap; }
  #lbStage { position: relative; display: grid; place-items: center; overflow: hidden; padding: 10px; }
  /* Bilden fyller ramen (contain) i stället för max-höjd i procent, som inte räknas mot rutnätets rad i alla webbläsare.
     Ett tryck på bilden växlar till full storlek, och då går ramen att scrolla */
  #lbStage img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; display: block; cursor: zoom-in; }
  #lbStage.zoom { display: block; overflow: auto; -webkit-overflow-scrolling: touch; }
  #lbStage.zoom img { position: static; width: auto; height: auto; max-width: none; margin: 0 auto; cursor: zoom-out; }
  #lbStage.zoom .nav { display: none; }
  #lbStage .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; font-size: 24px; opacity: .8; }
  #lbPrev { left: 10px; } #lbNext { right: 10px; }
  @media (max-width: 760px) {
    header { padding: 8px 10px; } input { width: 100%; order: 5; } #info { margin-left: 0; }
    main { padding: 10px 8px 30px; } .group { padding: 8px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
    .rgrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    #lbStage .nav { width: 36px; height: 52px; }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark" role="img" aria-label="Darrowmere"></span><b>GALLERY</b>
  <span class="seg" id="views"><button data-v="results" title="The finished model (or image) of every order">Results</button><button data-v="files" title="Every file of every step">All files</button></span>
  <span id="chips"></span>
  <select id="asset" title="Show one asset"></select>
  <input id="q" placeholder="Search name, order or step" spellcheck="false">
  <button id="cmpHead" disabled title="Tick Compare on 2–4 models, then open them side by side">Compare 0/4</button><button id="cmpReset" hidden title="Untick all models">✕ Reset</button>
  <button id="reload" title="Read Darrowmere again">Refresh</button>
  <span id="info"></span>
</header>
<main id="main"><div id="msg">Loading…</div></main>
<div id="cmpBar"><span id="cmpN"></span><button id="cmpGo" title="Open the chosen models side by side, turning together">Compare</button><button id="cmpClear" title="Clear the selection">Clear</button></div>
<div id="lb" role="dialog" aria-label="Image">
  <div class="bar"><button id="lbClose" title="Close (Esc)">✕</button><span id="lbName"></span><a id="lbOpen" target="_blank">Full size ↗</a></div>
  <div id="lbStage"><img id="lbImg" alt="" title="Tap to see full size and scroll"><button class="nav" id="lbPrev" title="Previous (←)">‹</button><button class="nav" id="lbNext" title="Next (→)">›</button></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KINDS = [["model", "Models"], ["image", "Images"], ["render", "Renders"], ["inspect", "Inspection"], ["map", "Texture maps"]];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("gal." + k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem("gal." + k, JSON.stringify(v)); } catch {} } };
let groups = [], on = new Set(store.get("kinds", ["model", "image", "render"])), list = [], cur = 0;
// m = filens ändringstid: en fil som ersatts under samma namn får en ny adress, så att webbläsaren inte visar den gamla
const fileUrl = i => "/api/file?" + new URLSearchParams({ filename: i.filename, subfolder: i.subfolder, type: "output", m: Math.round(i.mtime) });
const thumbUrl = (name, i) => "/api/thumb?" + new URLSearchParams({ filename: name, subfolder: i.subfolder, m: Math.round(i.mtime) });
const modelThumbUrl = i => "/api/model_thumb?" + new URLSearchParams({ filename: i.filename, subfolder: i.subfolder, m: Math.round(i.mtime) });
const viewerUrl = i => "/viewer?" + new URLSearchParams({ filename: i.filename, subfolder: i.subfolder, type: "output", m: Math.round(i.mtime) });
let VIEW = store.get("view", "results"), picked = new Map();
const when = t => new Date(t * 1000).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
// Datum och tid under varje tumnagel: "Today 17:42", "Yesterday 09:10", annars "9 Nov 2026, 17:42"
const stamp = t => {
  const d = new Date(t * 1000), now = new Date(), hm = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff === 0) return "Today " + hm;
  if (diff === 1) return "Yesterday " + hm;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) + ", " + hm;
};
const mb = n => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " kB";

function chips() {
  const n = {}; groups.forEach(g => g.items.forEach(i => n[i.kind] = (n[i.kind] || 0) + 1));
  $("chips").innerHTML = KINDS.map(([k, l]) => `<button class="chip k-${k} ${on.has(k) ? "on" : ""}" data-k="${k}"><i></i>${l}<small>${n[k] || 0}</small></button>`).join(" ");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => {
    on.has(b.dataset.k) ? on.delete(b.dataset.k) : on.add(b.dataset.k); store.set("kinds", [...on]); chips(); render();
  });
}
function assets() {
  const a = [...new Set(groups.map(g => g.asset).filter(Boolean))].sort(), sel = store.get("asset", "");
  $("asset").innerHTML = `<option value="">All assets</option>` + a.map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
}
function groupHtml(g, items, rank) {
  const cloud = [...new Set(g.items.map(i => i.cloud).filter(Boolean))];
  let html = `<section class="group"><div class="gh">${rank ? `<span class="rank">#${rank}</span>` : ""}<h2>${esc(g.title)}</h2>
    ${g.score != null ? `<span class="tag score ${esc(g.verdict)}" title="AI review">${g.score}/10 ${esc(g.verdict)}</span>` : ""}
    ${g.asset ? `<span class="tag">${esc(g.asset)}</span>` : ""}${cloud.map(c => `<span class="tag cloud">☁ ${esc(c)}</span>`).join("")}
    <span class="meta">${when(g.time)}${g.order ? " · " + esc(g.order) : ""} · ${items.length} file${items.length > 1 ? "s" : ""}</span></div>
    ${g.operator && g.operator.why ? `<div class="why">Operator, round ${esc(g.operator.round ?? "")}: ${esc(g.operator.why)}</div>` : ""}<div class="grid">`;
  let step = null;
  // stegrubriker bara när något steg har flera filer; annars står steget i bildtexten
  const per = {}; items.forEach(i => per[i.step] = (per[i.step] || 0) + 1);
  const dividers = g.order && Object.values(per).some(n => n > 2);
  for (const i of items) {
    const cap = !dividers && i.step_label ? i.step_label : i.filename;
    if (dividers && i.step !== step) {
      step = i.step;
      html += `<div class="step"><b>${esc(i.step_label || i.step || "files")}</b>${i.note ? `<span>${esc(i.note)}</span>` : ""}</div>`;
    }
    const label = KINDS.find(k => k[0] === i.kind)[1].replace(/s$/, "").replace("Texture map", "Map").replace("Inspection", "Inspect");
    const title = `${i.filename} · ${mb(i.size)} · ${when(i.mtime)}`;
    if (i.kind === "model") {
      const v = "/viewer?" + new URLSearchParams({ filename: i.filename, subfolder: i.subfolder, type: "output", m: Math.round(i.mtime) });
      html += `<a class="card k-model" href="${v}" target="_blank" title="${esc(title)} · open in the 3D viewer">
        <div class="thumb">${i.thumb ? `<img loading="lazy" src="${thumbUrl(i.thumb, i)}" alt="">` : `<span class="ph">3D</span>`}</div>
        <span class="badge">3D</span><div class="cap">${esc(cap)}</div><div class="when">${stamp(i.mtime)}</div></a>`;
    } else {
      const n = list.push(i) - 1;
      html += `<div class="card k-${i.kind}" data-n="${n}" title="${esc(title)}">
        <div class="thumb"><img loading="lazy" src="${thumbUrl(i.filename, i)}" alt=""></div>
        ${i.kind !== "image" ? `<span class="badge">${label}</span>` : ""}<div class="cap">${esc(cap)}</div><div class="when">${stamp(i.mtime)}</div></div>`;
    }
  }
  return html + `</div></section>`;
}
// ---- Results: en ruta per beställning med det färdiga (sista modellsteget, annars den senaste bilden) ----
function heroes(g) {
  const models = g.items.filter(i => i.kind === "model");
  if (models.length) {
    const last = Math.max(...models.map(i => i.mtime));
    if (!g.order) return models;
    // Samma steg kan ge flera varianter (olika namn); av samma namn med löpnummer (Pixal3D: form, uppskalad, texturerad) bara den sista
    const byStem = {};
    models.filter(i => i.mtime >= last - 300).forEach(i => { const k = i.filename.replace(/_?\d{5}_?\.(glb|gltf)$/i, ""); if (!byStem[k] || i.filename > byStem[k].filename) byStem[k] = i; });
    return Object.values(byStem);
  }
  if (!g.order) return [];
  // An image order (no model): every image as its own card, in the order they were made, not hidden under Files
  const imgs = g.items.filter(i => i.kind === "image").sort((a, b) => a.mtime - b.mtime);
  if (imgs.length) return imgs;
  const pics = g.items.filter(i => i.kind === "render");
  return pics.length ? [pics.reduce((a, b) => b.mtime > a.mtime ? b : a)] : [];
}
function rcard(g, i, rank) {
  const isM = i.kind === "model", key = `${i.subfolder}|${i.filename}|${Math.round(i.mtime)}`;
  const n = isM ? -1 : list.push(i) - 1;
  const src = isM ? (i.thumb ? thumbUrl(i.thumb, i) : "") : thumbUrl(i.filename, i);
  const img = src ? `<img loading="lazy" src="${src}" alt="">` : `<span class="ph">3D</span><img data-mt="${modelThumbUrl(i)}" alt="" hidden>`;
  const cloud = [...new Set(g.items.map(x => x.cloud).filter(Boolean))];
  return `<div class="rcard ${picked.has(key) ? "sel" : ""}" data-key="${esc(key)}">
    <div class="thumb" ${isM ? `data-view="${viewerUrl(i)}"` : `data-n="${n}"`} title="${isM ? "Open in the 3D viewer" : "Open the image"}">${img}
      <span class="badge k-${isM ? "model" : i.kind}">${isM ? "3D" : i.kind === "render" ? "Render" : "Image"}</span>
      ${isM ? `<label class="pick" title="Pick 2–4 models to compare side by side"><input type="checkbox" data-pick="${esc(key)}" ${picked.has(key) ? "checked" : ""}>Compare</label>` : ""}</div>
    <div class="rbody"><b>${rank ? `<span class="rank">#${rank}</span> ` : ""}${esc(g.order ? g.title : i.filename)}</b>
      <span class="when">${stamp(i.mtime)}</span>
      ${g.order ? `<span class="sub" title="${esc(i.filename)}">${esc(i.filename)}</span>` : ""}
      <div class="rtags">${g.score != null ? `<span class="tag score ${esc(g.verdict)}" title="AI review">${g.score}/10</span>` : ""}
        ${g.asset ? `<span class="tag">${esc(g.asset)}</span>` : ""}${cloud.map(c => `<span class="tag cloud">☁ ${esc(c)}</span>`).join("")}</div>
      ${isM && g.order ? srcStrip(g) : ""}
      <div class="racts">${g.order && heroes(g).length < g.items.length ? `<button data-files="${esc(g.order)}" title="Every file this order made, step by step">Files ${g.items.length}</button>` : ""}
</div>
    </div></div>`;
}
// Beställningens bilder (t.ex. Krea-bilderna en modell gjordes av) som små rutor under modellkortet; vyark och renderingar räknas inte
function srcStrip(g) {
  const imgs = g.items.filter(i => i.kind === "image" && !/views/i.test(i.filename)).slice(0, 6);
  if (!imgs.length) return "";
  return `<div class="srcs">${imgs.map(i => `<img loading="lazy" data-n="${list.push(i) - 1}" src="${thumbUrl(i.filename, i)}" title="${esc(i.filename)}" alt="">`).join("")}</div>`;
}
function renderResults() {
  const q = $("q").value.trim().toLowerCase(), asset = $("asset").value;
  list = [];
  const blocks = [], missions = {};
  let shown = 0;
  for (const g of groups) {
    if (asset && g.asset !== asset) continue;
    const gText = `${g.title} ${g.order || ""} ${g.asset} ${g.mission || ""} ${g.mission_title || ""}`.toLowerCase();
    const hs = heroes(g).filter(i => !q || gText.includes(q) || i.filename.toLowerCase().includes(q));
    if (!hs.length) continue;
    shown += hs.length;
    if (g.mission) {
      let m = missions[g.mission];
      if (!m) blocks.push(m = missions[g.mission] = { mission: g.mission, title: "", time: 0, entries: [] });
      m.title = m.title || g.mission_title; m.time = Math.max(m.time, g.time); m.entries.push([g, hs]);
    } else blocks.push({ time: g.time, entries: [[g, hs]] });
  }
  blocks.sort((a, b) => b.time - a.time);
  const openSet = new Set(store.get("openMissions", []));
  let html = "", loose = "", first = true;
  const flush = () => { if (loose) html += `<section class="rsec"><div class="rgrid">${loose}</div></section>`; loose = ""; };
  for (const b of blocks) {
    if (!b.mission) {
      const [g, hs] = b.entries[0];
      if (g.order) { hs.forEach(i => loose += rcard(g, i)); continue; }   // beställningar utan uppdrag: i en gemensam rad
      flush();   // lösa filer (ComfyUI-genereringar, 3D-modeller per dag): en egen rubrik, så att de inte blandas med beställningarna
      html += `<section class="rsec"><h3>${esc(g.title)}</h3><div class="rgrid">${hs.map(i => rcard(g, i)).join("")}</div></section>`;
      continue;
    }
    flush();
    b.entries.sort(([a], [c]) => (c.score ?? -1) - (a.score ?? -1) || c.time - a.time);
    // Utfällt: det senaste uppdraget och allt som ändrats det senaste dygnet, om det inte fällts ihop för hand
    const fresh = (first || Date.now() / 1000 - b.time < 86400) && !store.get("closed." + b.mission, false);
    const open = openSet.has(b.mission) || fresh || q;
    first = false;
    const n = b.entries.reduce((s, [, hs]) => s + hs.length, 0), scored = b.entries.some(([g]) => g.score != null);
    html += `<details class="mission" data-m="${esc(b.mission)}" ${open ? "open" : ""}><summary><h2>${esc(b.title || b.mission)}</h2>
      <span class="tag">${b.entries.length} order${b.entries.length > 1 ? "s" : ""} · ${n} result${n > 1 ? "s" : ""}</span><span class="meta">${when(b.time)}</span></summary><div class="rgrid">`;
    b.entries.forEach(([g, hs], k) => hs.forEach(i => html += rcard(g, i, scored && g.score != null ? k + 1 : 0)));
    html += `</div></details>`;
  }
  flush();
  $("main").innerHTML = html || `<div id="msg">${groups.length ? "No results match. Try All files." : "Darrowmere has not made anything yet."}</div>`;
  $("main").querySelectorAll(".thumb[data-view]").forEach(t => t.onclick = e => { if (!e.target.closest(".pick")) window.open(t.dataset.view, "_blank"); });
  $("main").querySelectorAll(".thumb[data-n], .srcs img[data-n]").forEach(t => t.onclick = () => show(+t.dataset.n));
  // Files: every kind this order made is switched on, so the view is never empty because a chip is off
  $("main").querySelectorAll("button[data-files]").forEach(b => b.onclick = () => {
    const g = groups.find(x => x.order === b.dataset.files);
    if (g) { g.items.forEach(i => on.add(i.kind)); store.set("kinds", [...on]); chips(); }
    $("q").value = b.dataset.files; setView("files"); window.scrollTo(0, 0);
  });
  $("main").querySelectorAll("input[data-pick]").forEach(c => c.onchange = () => pick(c.dataset.pick, c.checked, c));
  $("main").querySelectorAll("details.mission").forEach(d => d.ontoggle = () => {
    const s = new Set(store.get("openMissions", []));
    d.open ? s.add(d.dataset.m) : s.delete(d.dataset.m); store.set("openMissions", [...s]); store.set("closed." + d.dataset.m, !d.open);
    if (d.open) watchModelThumbs();
  });
  $("info").textContent = `${shown} result${shown === 1 ? "" : "s"}`;
  watchModelThumbs();
}
// Förhandsbilder för modeller som saknar en: Darrowmere renderar dem en åt gången när rutan syns
let mq = [], mbusy = false, mobs = null;
function watchModelThumbs() {
  mobs && mobs.disconnect();
  mobs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { mobs.unobserve(e.target); mq.push(e.target); pumpThumbs(); } }), { rootMargin: "200px" });
  document.querySelectorAll("img[data-mt]").forEach(i => mobs.observe(i));
}
function pumpThumbs() {
  if (mbusy || !mq.length) return;
  const img = mq.shift();
  if (!img.isConnected || img.src) return pumpThumbs();
  mbusy = true;
  const done = ok => {
    mbusy = false;
    if (ok) { img.hidden = false; img.previousElementSibling?.remove(); }
    else if ((+img.dataset.tries || 0) < 5) {   // Darrowmere var upptagen: försök igen om en minut
      img.dataset.tries = (+img.dataset.tries || 0) + 1;
      setTimeout(() => { if (img.isConnected) { img.removeAttribute("src"); mq.push(img); pumpThumbs(); } }, 60000);
    }
    pumpThumbs();
  };
  img.onload = () => done(true); img.onerror = () => done(false);
  img.src = img.dataset.mt + (img.dataset.tries ? "&try=" + img.dataset.tries : "");
}
function pick(key, onOff, el) {
  if (onOff && picked.size >= 4) { el.checked = false; return; }
  onOff ? picked.set(key, true) : picked.delete(key);
  el.closest(".rcard").classList.toggle("sel", onOff);
  $("cmpN").textContent = `${picked.size} model${picked.size === 1 ? "" : "s"} picked`;
  $("cmpBar").classList.toggle("on", picked.size > 0);
  $("cmpGo").disabled = picked.size < 2;
  $("cmpHead").textContent = `Compare ${picked.size}/4`; $("cmpHead").disabled = picked.size < 2; $("cmpReset").hidden = !picked.size;
}
$("cmpHead").onclick = () => $("cmpGo").click();
$("cmpGo").onclick = () => {
  const qs = new URLSearchParams(); [...picked.keys()].forEach(k => qs.append("f", k));
  window.open("/compare?" + qs, "_blank");
};
$("cmpClear").onclick = () => { picked.clear(); $("cmpBar").classList.remove("on"); $("cmpHead").textContent = "Compare 0/4"; $("cmpHead").disabled = true; $("cmpReset").hidden = true; render(); };
$("cmpReset").onclick = () => $("cmpClear").click();
function setView(v) {
  VIEW = v; store.set("view", v);
  document.body.classList.toggle("results", v === "results");
  $("views").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  render();
}
$("views").querySelectorAll("button").forEach(b => b.onclick = () => setView(b.dataset.v));

function render() {
  if (VIEW === "results") return renderResults();
  const q = $("q").value.trim().toLowerCase(), asset = $("asset").value;
  let shown = 0;
  list = [];
  // Synliga beställningar; de med samma uppdrag samlas under uppdraget, som tar tiden från sin senaste beställning
  const blocks = [], missions = {};
  for (const g of groups) {
    if (asset && g.asset !== asset) continue;
    const gText = `${g.title} ${g.order || ""} ${g.asset} ${g.mission || ""} ${g.mission_title || ""}`.toLowerCase();
    const items = g.items.filter(i => on.has(i.kind) && (!q || gText.includes(q) || `${i.filename} ${i.step_label || ""} ${i.note || ""}`.toLowerCase().includes(q)));
    if (!items.length) continue;
    shown += items.length;
    if (g.mission) {
      let m = missions[g.mission];
      if (!m) blocks.push(m = missions[g.mission] = { mission: g.mission, title: "", time: 0, entries: [] });
      m.title = m.title || g.mission_title; m.note = m.note || g.mission_note; m.time = Math.max(m.time, g.time); m.entries.push([g, items]);
    } else blocks.push({ time: g.time, entries: [[g, items]] });
  }
  blocks.sort((a, b) => b.time - a.time);
  const openSet = new Set(store.get("openMissions", []));
  let html = "", first = true;
  for (const b of blocks) {
    if (!b.mission) { html += groupHtml(...b.entries[0]); continue; }
    b.entries.sort(([a], [c]) => (c.score ?? -1) - (a.score ?? -1) || c.time - a.time);
    const best = b.entries[0][0], running = b.entries.some(([g]) => ["running", "approval", "queued", "planned"].includes(g.status));
    const open = openSet.has(b.mission) || (first && !store.get("closed." + b.mission, false));
    first = false;
    html += `<details class="mission" data-m="${esc(b.mission)}" ${open ? "open" : ""}><summary><h2>${esc(b.title || b.mission)}</h2>
      <span class="tag">Mission · ${b.entries.length} order${b.entries.length > 1 ? "s" : ""}</span>
      ${best.score != null ? `<span class="tag score ${esc(best.verdict)}">best ${best.score}/10 · ${esc(best.title)}</span>` : ""}
      ${running ? `<span class="tag">running</span>` : ""}<span class="meta">${when(b.time)}</span>
      ${b.note ? `<div class="why" style="flex-basis:100%;margin:0">Operator (${esc(b.note.playbook)}): ${esc(b.note.status)} · ${b.note.rounds}/${b.note.max_rounds} rounds · ${esc(b.note.message || "")}</div>` : ""}</summary><div class="mgroups">`;
    b.entries.forEach(([g, items], k) => html += groupHtml(g, items, k + 1));
    html += `</div></details>`;
  }
  $("main").innerHTML = html || `<div id="msg">${groups.length ? "Nothing matches the filters." : "Darrowmere has not made anything yet."}</div>`;
  $("main").querySelectorAll(".card[data-n]").forEach(c => c.onclick = () => show(+c.dataset.n));
  $("main").querySelectorAll("details.mission").forEach(d => d.ontoggle = () => {
    const s = new Set(store.get("openMissions", []));
    d.open ? s.add(d.dataset.m) : s.delete(d.dataset.m); store.set("openMissions", [...s]); store.set("closed." + d.dataset.m, !d.open);
  });
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  $("info").textContent = `${shown} of ${total} files`;
}
function show(n) {
  if (!list.length) return;
  cur = (n + list.length) % list.length;
  const i = list[cur];
  $("lbStage").classList.remove("zoom"); $("lbStage").scrollTo(0, 0);
  $("lbImg").src = fileUrl(i);
  $("lbOpen").href = fileUrl(i);
  $("lbName").textContent = `${cur + 1} / ${list.length} · ${i.filename}${i.step_label ? " · " + i.step_label : ""} · ${mb(i.size)}`;
  $("lb").classList.add("open");
}
const close = () => { $("lb").classList.remove("open"); $("lbImg").removeAttribute("src"); };
$("lbClose").onclick = close;
$("lbPrev").onclick = () => show(cur - 1);
$("lbNext").onclick = () => show(cur + 1);
$("lbStage").onclick = e => { if (e.target.id === "lbStage") close(); };
$("lbImg").onclick = () => { $("lbStage").classList.toggle("zoom"); $("lbStage").scrollTo(0, 0); };
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") show(cur - 1); else if (e.key === "ArrowRight") show(cur + 1);
});
let tx = null;  // svep på telefonen
$("lbStage").addEventListener("touchstart", e => tx = $("lbStage").classList.contains("zoom") ? null : e.touches[0].clientX, { passive: true });
$("lbStage").addEventListener("touchend", e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1)); });
$("q").oninput = render;
$("asset").onchange = () => { store.set("asset", $("asset").value); render(); };
async function load(fresh) {
  $("info").textContent = "Reading Darrowmere…";
  try {
    const r = await fetch("/api/gallery" + (fresh ? "?fresh=1" : "")), j = await r.json();
    if (!j.ok) throw new Error(j.message);
    groups = j.groups; assets(); chips(); setView(VIEW);
  } catch (e) { $("main").innerHTML = `<div id="msg">Could not read the gallery: ${esc(e.message)}</div>`; $("info").textContent = ""; }
}
$("reload").onclick = () => load(true);
load(false);
</script>
