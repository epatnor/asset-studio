<!doctype html>
<html lang="en">
<head>
<script>/* Tema: menyvalet i panelen (darrowmere-theme: dark, light, system), mörkt om inget valts */(function(){var m;try{m=localStorage.getItem("darrowmere-theme")}catch(e){}if(m!=="light"&&m!=="system")m="dark";var t=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;var r=document.documentElement;r.dataset.theme=t;r.dataset.themeMode=m;if(t==="light")addEventListener("DOMContentLoaded",function(){var q=document.querySelector('meta[name="theme-color"]');if(q)q.content="#ffffff"})})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darrowmere Viewer</title>
<style>
  :root { --bg: #f1f2f4; --panel: rgba(255,255,255,.92); --line: #d8dce1; --text: #1d2125; --muted: #6a737d; --accent: #3b6fd4; }
  :root[data-theme="dark"] { --bg: #15181c; --panel: rgba(28,32,38,.92); --line: #2f353d; --text: #e6e8eb; --muted: #8b949e; --accent: #6b9bff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .bar { position: fixed; left: 12px; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .bar b { font-weight: 600; margin-right: 6px; word-break: break-all; }
  .info { color: var(--muted); margin-right: auto; }
  button, a.btn { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; text-decoration: none; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 220px; text-align: center; }
  .prog { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .prog div { height: 100%; width: 0; background: var(--accent); }
  .hint { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <b id="name">…</b><span class="info" id="info"></span>
  <button id="tex" class="on" title="Show the texture or plain clay">Texture</button>
  <button id="wire" title="Show the triangles">Wireframe</button>
  <button id="thru" class="on" hidden title="On: see the triangles on the far side too. Off: a solid surface with only the edges facing you">See through</button>
  <button id="spin" title="Turn the model slowly">Rotate</button>
  <button id="light" title="Light or dark background">Background</button>
  <button id="reset" title="Frame the model again">Reset view</button>
  <a class="btn" id="dl" download>Download</a>
</div>
<div id="status">Loading model…<div class="prog"><div id="prog"></div></div></div>
<div class="hint">Drag to orbit · right-drag to pan · scroll to zoom</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// Datorer utan grafikkort (eller med grafiken avstängd, som i fjärrskrivbord) ritar WebGL i mjukvara: då ritas bilden i
// lägre upplösning och utan utjämning, så att modellen går att vrida
function softwareGL(r) {
  try { const gl = r.getContext(), x = gl.getExtension("WEBGL_debug_renderer_info");
        return /swiftshader|llvmpipe|software|basic render|softpipe|mesa offscreen/i.test(x ? gl.getParameter(x.UNMASKED_RENDERER_WEBGL) : ""); }
  catch (e) { return false; }
}

const params = new URLSearchParams(location.search);
const file = params.get("filename") || "";
const url = "/api/file?" + params.toString();
document.getElementById("name").textContent = file;
document.getElementById("dl").href = url;
document.title = file + " · Darrowmere Viewer";

const el = document.getElementById("view");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById("status").textContent = "This browser has no WebGL, so the model cannot be shown here. Use Download, or open the page in Chrome.";
  throw e;
}
const SOFT_GL = softwareGL(renderer);
renderer.setPixelRatio(SOFT_GL ? 0.6 : Math.min(2, window.devicePixelRatio));
renderer.setSize(el.clientWidth, el.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
el.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const dark = document.documentElement.dataset.theme === "dark";
let darkBg = dark;
const setBg = () => scene.background = new THREE.Color(darkBg ? 0x1b1e23 : 0xe9ebee);
setBg();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(2, 3, 2);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(35, el.clientWidth / el.clientHeight, 0.001, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = !SOFT_GL;
// Rita bara när något ändras (vridning, zoom, knappar), inte 60 gånger i sekunden i onödan
let need = true;
const redraw = () => need = true;
controls.addEventListener("change", redraw);

let root = null, home = null;
const originals = new Map();
const clay = new THREE.MeshStandardMaterial({ color: 0xc9c4bd, roughness: 0.8 });

function frame() {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const r = size.length() / 2 || 1;
  // Avstånd så att hela modellen ryms på höjden och bredden, med lite marginal
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const fitH = (size.y / 2) / Math.tan(fov / 2), fitW = (size.x / 2) / (Math.tan(fov / 2) * camera.aspect);
  const dist = Math.max(fitH, fitW) * 1.25 + size.z / 2;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0, size.y * 0.05, dist));
  camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix();
  controls.update();
  const g = new THREE.GridHelper(r * 4, 20, 0x888888, 0x888888);
  g.material.opacity = 0.25; g.material.transparent = true; g.position.y = box.min.y;
  if (home?.grid) scene.remove(home.grid);
  scene.add(g);
  home = { pos: camera.position.clone(), target: center.clone(), grid: g };
}

new GLTFLoader().load(url, gltf => {
  root = gltf.scene;
  let tris = 0, texSize = null;
  root.traverse(o => {
    if (!o.isMesh) return;
    originals.set(o, o.material);
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    const map = o.material?.map;
    if (map?.image && !texSize) texSize = `${map.image.width}×${map.image.height}`;
  });
  scene.add(root);
  frame(); redraw();
  document.getElementById("status").remove();
  document.getElementById("info").textContent =
    `${Math.round(tris).toLocaleString()} triangles · ${texSize ? "texture " + texSize : "no texture"}`;
}, ev => {
  if (ev.total) document.getElementById("prog").style.width = (100 * ev.loaded / ev.total) + "%";
}, err => {
  document.getElementById("status").textContent = "Could not load the model: " + (err.message || err);
});

const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { b.classList.toggle("on"); fn(b.classList.contains("on")); redraw(); }; };
let texOn = true;
toggle("tex", on => { texOn = on; applyWire(); });
// Trådmodellen: genomskinlig (bara trådarna, även de på baksidan) eller på en mörk hel yta med bara de synliga kanterna
// ovanpå i vitt, så att rutnätet syns tydligt
let wireOn = false, seeThrough = true;
const overlays = new Map();
const wireMat = new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, opacity: 0.35, depthWrite: false });
const darkClay = new THREE.MeshStandardMaterial({ color: 0x24272d, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
function applyWire() {
  const solid = wireOn && !seeThrough;
  wireMat.color.set(solid ? 0xffffff : (darkBg ? 0xe6e6e6 : 0x1a1a1a));
  wireMat.opacity = solid ? 0.8 : 0.35;
  originals.forEach((m, o) => {
    o.material = solid ? darkClay : (texOn ? m : clay);
    for (const x of [m].flat().concat([clay])) {
      x.wireframe = wireOn && seeThrough;
      x.needsUpdate = true;
    }
    let w = overlays.get(o);
    if (solid && !w) { w = o.clone(false); w.material = wireMat; o.parent.add(w); overlays.set(o, w); }
    if (w) w.visible = solid;
  });
  document.getElementById("thru").hidden = !wireOn;
}
toggle("wire", on => { wireOn = on; applyWire(); });
toggle("thru", on => { seeThrough = on; applyWire(); });
toggle("spin", on => controls.autoRotate = on);
document.getElementById("light").onclick = () => { darkBg = !darkBg; setBg(); applyWire(); redraw(); };
document.getElementById("reset").onclick = () => { if (!home) return; camera.position.copy(home.pos); controls.target.copy(home.target); controls.update(); };

addEventListener("resize", () => {
  renderer.setSize(el.clientWidth, el.clientHeight);
  camera.aspect = el.clientWidth / el.clientHeight; camera.updateProjectionMatrix(); redraw();
});
renderer.setAnimationLoop(() => { if (controls.update() || need || controls.autoRotate) { renderer.render(scene, camera); need = false; } });
if (SOFT_GL) document.querySelector(".hint").textContent += " · software graphics: lower resolution for speed";
</script>
</body>
</html>
